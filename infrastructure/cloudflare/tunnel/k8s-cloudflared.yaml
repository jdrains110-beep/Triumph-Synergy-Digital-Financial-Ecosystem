# Cloudflared as k3s Deployment — alternative to docker-compose
# Inject TUNNEL_TOKEN via Secret (from `terraform output -raw tunnel_token`)
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: triumph
type: Opaque
stringData:
  TUNNEL_TOKEN: "REPLACE_WITH_TUNNEL_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: triumph
  labels:
    app: cloudflared
spec:
  replicas: 2                     # HA: 2 replicas, each runs 4 edge connections
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.4.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:9090
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: TUNNEL_TOKEN
          ports:
            - { name: metrics, containerPort: 9090 }
          resources:
            requests: { cpu: "50m",  memory: "64Mi"  }
            limits:   { cpu: "500m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            failureThreshold: 3
            periodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: cloudflared } }
