# NOTE: This file is a TEMPLATE. Real secrets MUST be created out-of-band:
#
#   kubectl -n triumph create secret generic triumph-secrets \
#     --from-literal=POSTGRES_PASSWORD=YOUR_PASSWORD \
#     --from-literal=GITHUB_TOKEN=YOUR_PAT \
#     --from-literal=AUTH_SECRET=$(openssl rand -hex 32) \
#     --from-literal=PI_API_KEY=YOUR_KEY
#
# Or use sealed-secrets / external-secrets-operator in production.
# Do NOT commit a real Secret with stringData populated.
#
apiVersion: v1
kind: Secret
metadata:
  name: triumph-secrets
  namespace: triumph
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  GITHUB_TOKEN: "REPLACE_ME"
  AUTH_SECRET: "REPLACE_ME"
  PI_API_KEY: "REPLACE_ME"
