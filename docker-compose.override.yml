# ==========================================================================
# TRIUMPH SYNERGY — APEX SUPER-SOVEREIGN OVERRIDE (Docker Desktop tuning)
# ==========================================================================
# Auto-merged by `docker compose up -d`.
# Adds: amd64 platform pin (Apple Silicon), tini init, graceful shutdown,
#       elevated ulimits/nofile for the 7 super-pods + standalone services.
# ==========================================================================

name: triumph-synergy

x-platform: &platform { platform: linux/amd64 }
x-init:     &init     { init: true }
x-grace:    &grace    { stop_grace_period: 30s }
x-ulimits:  &ulimits
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  postgres:
    <<: [ *init, *grace ]
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    <<: [ *init, *grace ]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  vault:
    <<: [ *platform, *init, *grace, *ulimits ]

  pi-bridge-connector:
    <<: [ *platform, *init, *grace, *ulimits ]

  governance-shield:
    <<: [ *platform, *init, *grace, *ulimits ]

  app:
    <<: [ *platform, *init, *grace, *ulimits ]

  settlement-core:
    <<: [ *platform, *init, *grace, *ulimits ]

  financial-intel:
    <<: [ *platform, *init, *grace, *ulimits ]

  quantum-fortress:
    <<: [ *platform, *init, *grace, *ulimits ]

  sovereign-fortress:
    <<: [ *platform, *init, *grace, *ulimits ]

  horizon-stream:
    <<: [ *platform, *init, *grace, *ulimits ]

  payment-processor:
    <<: [ *platform, *init, *grace, *ulimits ]

  cloud-memory:
    <<: [ *platform, *init, *grace, *ulimits ]

  observability-stack:
    <<: [ *init, *grace, *ulimits ]

  nginx:
    <<: [ *init, *grace ]
    ulimits:
      nofile:
        soft: 131072
        hard: 131072

  ecosystem-guardian:
    <<: [ *platform, *init, *grace, *ulimits ]

  sovereign-insurance:
    <<: [ *platform, *init, *grace, *ulimits ]

  sovereign-utilities:
    <<: [ *platform, *init, *grace, *ulimits ]
