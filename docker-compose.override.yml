# ==========================================================================
# TRIUMPH SYNERGY — APEX SUPER-SOVEREIGN OVERRIDE (Docker Desktop tuning)
# ==========================================================================
# Auto-merged by `docker compose up -d`.
# Adds: native arm64 platform pin for EVERY Triumph container, tini init,
#       graceful shutdown, elevated ulimits/nofile.
#
# PLATFORM POLICY (hard rule):
#   The ONLY amd64 container in the entire stack is `pi-mainnet-node`
#   (Pi Network full node — stellar-core is published as an amd64-only
#   image). It is pinned to linux/amd64 directly in docker-compose.yml.
#
#   Every OTHER container MUST run native linux/arm64 ("arm64 or better").
#   No service may revert to amd64. The shared &platform anchor below is
#   arm64 and is applied to all formerly amd64-pinned services so a stray
#   DOCKER_DEFAULT_PLATFORM or rebuild can never silently switch them back.
#
# ARM64-NATIVE (all of these — ~6x faster on M-series, no Rosetta):
#   vault, governance-shield, settlement-core, horizon-stream,
#   apex-services, apex-sovereign-nexus, sovereign-life,
#   guardian-watchdog-nexus, quantum-intel-fortress, pi-bridge-connector, app
# ==========================================================================

name: triumph-synergy

x-platform: &platform { platform: linux/arm64 }
x-init: &init { init: true }
x-grace: &grace { stop_grace_period: 30s }
x-ulimits: &ulimits
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  postgres:
    <<: [ *init, *grace ]
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    <<: [ *init, *grace ]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ──── arm64-native (formerly amd64-pinned — now forced arm64) ───────────
  vault:
    image: ghcr.io/jdrains110-beep/triumph-synergy-vault:latest
    <<: [ *platform, *grace, *ulimits ] # tini already in Dockerfile ENTRYPOINT; no double-init

  governance-shield:
    image: ghcr.io/jdrains110-beep/triumph-synergy-governance-shield:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  settlement-core:
    image: ghcr.io/jdrains110-beep/triumph-synergy-settlement-core:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  horizon-stream:
    image: ghcr.io/jdrains110-beep/triumph-synergy-horizon-stream:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  # ──── Native arm64 on Apple Silicon (pure Python/Node) ──────────────────
  pi-bridge-connector:
    image: ghcr.io/jdrains110-beep/triumph-synergy-pi-bridge-connector:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  app:
    image: ghcr.io/jdrains110-beep/triumph-synergy-app:latest
    <<: [ *platform, *init, *grace, *ulimits ]
    environment:
      NODE_ENV: development
      DOCKER_BUILD: "false"
    command:
      - /bin/sh
      - -lc
      - rm -f /app/proxy.ts /app/middleware.ts && exec node node_modules/next/dist/bin/next dev -H 0.0.0.0 -p 3000
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./services:/app/services
      - ./hooks:/app/hooks
      - ./types:/app/types
      - ./public:/app/public
      - ./instrumentation.ts:/app/instrumentation.ts
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json

  # quantum-intel-fortress replaces financial-intel + quantum-fortress (May 9, 2026)
  quantum-intel-fortress:
    image: ghcr.io/jdrains110-beep/triumph-synergy-quantum-intel-fortress:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  observability-stack:
    image: ghcr.io/jdrains110-beep/triumph-synergy-observability-stack:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  nginx:
    image: nginx:alpine
    <<: [ *platform, *init, *grace ]
    ulimits:
      nofile:
        soft: 131072
        hard: 131072

  # guardian-watchdog-nexus replaces ecosystem-guardian + saib-watchdog (May 9, 2026)
  guardian-watchdog-nexus:
    image: ghcr.io/jdrains110-beep/triumph-synergy-guardian-watchdog-nexus:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  apex-services:
    image: ghcr.io/jdrains110-beep/triumph-synergy-apex-services:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  # apex-sovereign-nexus replaces sovereign-commerce/work/gaming/publix (May 9, 2026)
  apex-sovereign-nexus:
    image: ghcr.io/jdrains110-beep/triumph-synergy-apex-sovereign-nexus:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  # APEX-SOVEREIGN-LIFE — bank + education + telecom consolidated
  sovereign-life:
    image: ghcr.io/jdrains110-beep/triumph-synergy-sovereign-life:latest
    <<: [ *platform, *init, *grace, *ulimits ]

  # Sovereign mesh peer activators — establish live WireGuard handshakes
  # so mesh status reflects active peers (not only static hub peer definitions).
  sovereign-mesh-peer-app:
    <<: [ *platform, *init, *grace ]
    build:
      context: docker/sovereign-mesh
      dockerfile: Dockerfile
    container_name: triumph-sovereign-mesh-peer-app
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    depends_on:
      sovereign-mesh-hub:
        condition: service_started
    environment:
      PEER_NODE: app
      PEER_IP: 10.13.37.10
    volumes:
      - triumph_mesh_keys:/app/keys:ro
    entrypoint: [ "/peer_entrypoint.sh" ]
    networks:
      sovereign-mesh:
        ipv4_address: 10.13.37.10

  sovereign-mesh-peer-nginx:
