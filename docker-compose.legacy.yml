# ==========================================================================
# TRIUMPH SYNERGY DIGITAL FINANCIAL ECOSYSTEM
# ==========================================================================
# Docker Desktop deployment — runs ALONGSIDE Pi Network node
# Container prefix: triumph-*
#
# USAGE:
#   Mainnet:  docker compose up -d
#   Testnet:  docker compose --env-file .env.testnet up -d
#   Upgrade:  docker compose pull; docker compose up -d --build
#   Logs:     docker compose logs -f
#   Stop:     docker compose down
#
# RECOMMENDED DOCKER DESKTOP SETTINGS (macOS / Windows):
#   CPUs:   4 minimum — total container CPU budget is ~3.4 cores
#   Memory: 6 GB minimum, 8 GB recommended
#   Swap:   2 GB
#   Docker Desktop → Settings → Resources → Advanced
# ==========================================================================

name: triumph-synergy

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
  # ── Memory overflow protection: container dies before it kills WSL2 ──
  memswap_limit: 0           # No swap — OOM-kill the container, don't swap (prevents I/O death spiral)
  oom_kill_disable: false     # NEVER disable OOM killer — let Docker kill runaway containers
  labels:
    org.pinetwork.project: "triumph-synergy"
    org.pinetwork.central-node: "GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V"
    org.triumph.blockchain.powered-by: "Pi Network"
    org.triumph.consensus.protocol: "Stellar SCP"
    org.triumph.horizon.layer: "enabled"
    org.triumph.ecosystem.class: "sovereign-quantum-financial"
    org.triumph.positioning: "rival-and-superior-to-usd"
    org.triumph.real-world-utility: "20-plus-sectors"
    org.triumph.gateway: "universal-integration-gateway"
    org.triumph.owner.name: "Jeremiah Joel Drains"
    org.triumph.owner.organization: "Triumph-Synergy"
    org.triumph.governance.final-authority: "owner-approved"
    org.triumph.legal.compliance.required: "true"

x-db-env: &db-env
  POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
  REDIS_URL: redis://triumph-redis:6379
  # Supabase keys (set in .env or secrets manager for production)
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://your-project.supabase.co}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-anon-key}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
  SUPABASE_DB_URL: ${SUPABASE_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}}

x-pi-env: &pi-env
  PI_NETWORK_MODE: ${PI_NETWORK_MODE:-mainnet}
  # Active key resolves to mainnet or testnet depending on PI_NETWORK_MODE
  PI_API_KEY: ${PI_API_KEY:?PI_API_KEY required}
  PI_INTERNAL_API_KEY: ${PI_INTERNAL_API_KEY:?PI_INTERNAL_API_KEY required}
  # Both keys embedded so network-aware services can select the right one at runtime
  PI_MAINNET_API_KEY: ${PI_MAINNET_API_KEY:?PI_MAINNET_API_KEY required}
  PI_TESTNET_API_KEY: ${PI_TESTNET_API_KEY:?PI_TESTNET_API_KEY required}
  PI_API_SECRET: ${PI_API_SECRET:?PI_API_SECRET required}
  PI_API_URL: ${PI_API_URL:-https://api.minepi.com}
  NEXT_PUBLIC_PI_APP_ID: ${NEXT_PUBLIC_PI_APP_ID:-triumph-synergy}
  NEXT_PUBLIC_PI_SANDBOX: ${NEXT_PUBLIC_PI_SANDBOX:-false}
  PI_SUPERNODE_ADDRESS: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
  PI_SUPERNODE_MODE: "true"
  STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://api.mainnet.minepi.com}
  STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-Pi Network}
  CENTRAL_NODE_URL: http://triumph-central-node:11626
  CENTRAL_NODE_PUBLIC_KEY: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
  # Pi Node accessible via pi-bridge network (container name) and host
  PI_NODE_HOST: ${PI_NODE_CONTAINER:-testnet2}
  PI_NODE_PORT: ${PI_NODE_PORT:-31402}
  PI_NODE_API_PORT: ${PI_NODE_API_PORT:-8000}
  PI_NODE_PEER_PORT: ${PI_NODE_PEER_PORT:-31402}

services:
  # ========================================================================
  # INFRASTRUCTURE
  # ========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: triumph-postgres
    <<: *common
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.20
    oom_score_adj: -500          # Protect database — last to OOM-kill
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triumph_synergy}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    # Internal only — no host port exposure
    expose:
      - "5432"
    volumes:
      - triumph_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-triumph_synergy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: triumph-redis
    <<: *common
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.10
    oom_score_adj: -500          # Protect cache — last to OOM-kill
    # Internal only — no host port exposure
    expose:
      - "6379"
    volumes:
      - triumph_redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - triumph-net
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================================================
  # PI BRIDGE CONNECTOR — Central Node ↔ Pi Node (testnet2) live link
  # Polls testnet2:8000 (Horizon) every 5s, publishes to Redis, routes txs
  # ========================================================================

  pi-bridge-connector:
    build:
      context: docker/pi-bridge-connector
    container_name: triumph-pi-bridge-connector
    <<: *common
    restart: on-failure:10            # override: stop crash-looping if Pi Node desktop is offline (prevents CPU storm)
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.10
    environment:
      <<: [*db-env, *pi-env]
      PORT: "8092"
      PI_NODE_HOST: ${PI_NODE_CONTAINER:-testnet2}
      PI_NODE_API_PORT: 8000
      PI_NODE_PEER_PORT: ${PI_NODE_PEER_PORT:-31402}
      PI_NODE_FALLBACK_URL: http://host.docker.internal:31401
      PI_NODE_PUBLIC_FALLBACK_URL: https://api.testnet.minepi.com
      PI_POLL_RETRIES: "4"
      PI_POLL_RETRY_DELAY_S: "1.5"
      POLL_INTERVAL_S: "6"
      CENTRAL_NODE_URL: http://triumph-central-node:11626
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      SOVEREIGN_PQ_ENFORCE: "true"
      STELLAR_CORE_VERSION_OVERRIDE: "5.4"
      PI_NODE_VERSION_DISPLAY: "5.4"
    expose:
      - "8092"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(8); s.connect(('127.0.0.1',8092)); s.close()"]
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 45s

  # ========================================================================
  # PI CENTRAL NODE — Stellar Core Integration
  # ========================================================================

  central-node:
    build:
      context: .
      dockerfile: docker/central-node/Dockerfile
    container_name: triumph-central-node
    <<: *common
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.20
    environment:
      <<: [*db-env, *pi-env]
      NODE_TYPE: central
      NODE_PRIORITY: supreme
      STELLAR_CORE_HTTP_PORT: 11626
      STELLAR_CORE_PEER_PORT: 11625
      PI_API_URL: ${PI_API_URL:-https://api.minepi.com}
      # Prefer bridge proxy endpoint for resilient access to local Pi node.
      STELLAR_HORIZON_URL: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_LOCAL_HORIZON: http://triumph-pi-bridge-connector:8092/pi-node
      PI_INTERNAL_HORIZON_URL: http://triumph-pi-bridge-connector:8092/pi-node
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      SCP_AUTO_UPGRADE: "true"
      SCP_SYNC_INTERVAL_MS: 30000
      NODE_OPTIONS: "--max-old-space-size=384"
      PI_NODE_VERSION_DISPLAY: "5.4"
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      CENTRAL_NODE_REQUIRE_PQ_READY: "true"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    # Internal only — no host port exposure
    expose:
      - "11625"
      - "11626"
    volumes:
      - triumph_central_data:/app/data
      - triumph_stellar_data:/opt/stellar/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pi-bridge-connector:
        condition: service_started    # service_started (not service_healthy) — pi-bridge connects to external Pi Node;
                                      # if Pi Node desktop is offline, don't block entire ecosystem startup
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11626/info"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # NEXT.JS APPLICATION — Main Ecosystem UI & API
  # ========================================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triumph-app
    <<: *common
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.30
    ports:
      - "3000:3000"
    environment:
      <<: [*db-env, *pi-env]
      NODE_ENV: production
      DOCKER_BUILD: "true"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000/api}
      INTERNAL_PI_MULTIPLIER: ${INTERNAL_PI_MULTIPLIER:-1.5}
      INTERNAL_PI_MIN_VALUE: ${INTERNAL_PI_MIN_VALUE:-10.0}
      EXTERNAL_PI_MIN_VALUE: ${EXTERNAL_PI_MIN_VALUE:-1.0}
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      APP_REQUIRE_PQ_SIGNATURE: "true"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      central-node:
        condition: service_started    # service_started — Next.js handles central-node unavailability gracefully via retry logic
    networks:
      - triumph-net
      - pi-bridge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ========================================================================
  # PI TRANSACTION ENGINE — High-Throughput Processing
  # ========================================================================

  transaction-engine:
    build:
      context: .
      dockerfile: docker/transaction-engine/Dockerfile
    container_name: triumph-transaction-engine
    <<: *common
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.10
    environment:
      <<: [*db-env, *pi-env]
      ENGINE_MODE: hyper
      NODE_OPTIONS: "--max-old-space-size=96"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      TRANSACTION_REQUIRE_PQ_SIGNATURE: "true"
    volumes:
      - triumph_tx_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      central-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # PI TRILLION VAULT — Secure Storage
  # ========================================================================

  vault:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile
    container_name: triumph-vault
    <<: *common
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.10
    environment:
      <<: [*db-env, *pi-env]
      VAULT_MODE: trillion
      QUANTUM_ENCRYPTION: "true"
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      VAULT_REQUIRE_PQ_SIGNATURE: "true"
      NODE_OPTIONS: "--max-old-space-size=96"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    volumes:
      - triumph_vault_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      central-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # PI SMART CONTRACTS — Execution Engine
  # ========================================================================

  smart-contracts:
    build:
      context: .
      dockerfile: docker/smart-contracts/Dockerfile
    container_name: triumph-smart-contracts
    <<: *common
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.10
    environment:
      <<: [*db-env, *pi-env]
      EXECUTION_CHANNELS: 10000
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      SMART_CONTRACTS_REQUIRE_PQ_SIGNATURE: "true"
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      CENTRAL_NODE_URL: http://triumph-central-node:11626
      CONTRACTS_URL: http://triumph-smart-contracts:8082
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      NODE_OPTIONS: "--max-old-space-size=96"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    volumes:
      - triumph_contracts_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      central-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # PI SCP UPGRADER — Auto Protocol Sync
  # ========================================================================

  scp-upgrader:
    build:
      context: .
      dockerfile: docker/scp-upgrader/Dockerfile
    container_name: triumph-scp-upgrader
    <<: *common
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.08
    environment:
      <<: [*db-env, *pi-env]
      AUTO_UPGRADE: "true"
      ZERO_DOWNTIME: "true"
      ROLLBACK_ON_FAILURE: "true"
      VERSION_CHECK_INTERVAL_MS: 60000
      PARAMETER_SYNC_INTERVAL_MS: 30000
      # KEY FIX: use local Pi node for SCP data instead of external internet
      PI_MAINNET_HORIZON: https://api.mainnet.minepi.com
      PI_TESTNET_HORIZON: https://api.testnet.minepi.com
      PI_LOCAL_HORIZON: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      NETWORK_TYPE: ${PI_NETWORK_MODE:-mainnet}
      NODE_OPTIONS: "--max-old-space-size=48"
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      SCP_REQUIRE_PQ_SIGNATURE: "true"
    volumes:
      - triumph_scp_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      central-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # PI PAYMENT PROCESSOR — Queue-Based Payment Handling
  # ========================================================================

  payment-processor:
    build:
      context: ./services/payment-processor
      dockerfile: Dockerfile
    container_name: triumph-payment-processor
    <<: *common
    mem_limit: 96m
    mem_reservation: 48m
    cpus: 0.12
    environment:
      <<: [*db-env, *pi-env]
      WORKER_THREADS: 2
      NODE_OPTIONS: "--max-old-space-size=64"
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      PAYMENT_REQUIRE_PQ_SIGNATURE: "true"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # NGINX — Reverse Proxy & Load Balancer
  # ========================================================================

  nginx:
    image: nginx:alpine
    container_name: triumph-nginx
    <<: *common
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/nginx/server-cert.pem:/etc/nginx/certs/server-cert.pem:ro
      - ./certs/nginx/server-key.pem:/etc/nginx/certs/server-key.pem:ro
    depends_on:
      app:
        condition: service_started
      quantum-shield:
        condition: service_started    # service_started — quantum-shield's 60s startup should not delay nginx
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ========================================================================
  # MARKET DATA SERVICE — Live Pi Horizon data relay
  # ========================================================================

  market-data:
    build:
      context: .
      dockerfile: docker/market-data/Dockerfile
    container_name: triumph-market-data
    <<: *common
    mem_limit: 96m
    mem_reservation: 48m
    cpus: 0.10
    environment:
      <<: [*db-env, *pi-env]
      MARKET_POLL_MS: 5000
      # KEY FIX: market data reads live Pi ledger via bridge connector + Pi price from ML engine
      ML_ENGINE_URL: http://triumph-ml-engine:8090
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      MARKET_DATA_REQUIRE_PQ_SIGNATURE: "true"
      STELLAR_HORIZON_URL: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      NODE_OPTIONS: "--max-old-space-size=64"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ========================================================================
  # BLOCKCHAIN ORACLE — Pi ledger event stream → Redis pub/sub
  # ========================================================================

  blockchain-oracle:
    build:
      context: .
      dockerfile: docker/blockchain-oracle/Dockerfile
    container_name: triumph-blockchain-oracle
    <<: *common
    mem_limit: 96m
    mem_reservation: 48m
    cpus: 0.12
    environment:
      <<: [*db-env, *pi-env]
      CONTRACTS_URL: http://triumph-smart-contracts:8082
      # KEY FIX: oracle reads live Pi ledger events via bridge connector
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      ORACLE_REQUIRE_PQ_SIGNATURE: "true"
      STELLAR_HORIZON_URL: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      NODE_OPTIONS: "--max-old-space-size=64"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      smart-contracts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # COMPLIANCE ENGINE — KYC / AML / GDPR / MiCA screening
  # ========================================================================

  compliance:
    build:
      context: .
      dockerfile: docker/compliance/Dockerfile
    container_name: triumph-compliance
    <<: *common
    mem_limit: 96m
    mem_reservation: 48m
    cpus: 0.12
    environment:
      <<: [*db-env, *pi-env]
