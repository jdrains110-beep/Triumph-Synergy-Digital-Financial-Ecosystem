  # ========================================================================
  # CLOUD MEMORY PLATFORM — LZ4 compressed, deduplicated, multi-platform store
  # 60-80% smaller payloads | content-addressed dedup | cross-service broadcast
  # Sustains 22+ platforms within one unified memory layer
  # ========================================================================

  cloud-memory:
    build:
      context: docker/cloud-memory
    container_name: triumph-cloud-memory
    <<: *common
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 0.10
    user: "1000:1000"
    environment:
      PORT: "8095"
      REDIS_URL: redis://triumph-redis:6379
      DEFAULT_TTL_S: "3600"
      HOT_TTL_S: "300"
      WARM_TTL_S: "3600"
      COLD_TTL_S: "86400"
      LZ4_LEVEL: "9"
      AUTO_SYNC_ENABLED: ${CLOUD_MEMORY_AUTO_SYNC_ENABLED:-true}
      BACKUP_SCHEDULE_S: ${CLOUD_MEMORY_BACKUP_SCHEDULE_S:-900}
      BACKUP_LOCAL_DIR: /backup/local
      BACKUP_OFFLINE_DIR: /backup/offline
      CLOUD_MEMORY_S3_ENABLED: ${CLOUD_MEMORY_S3_ENABLED:-false}
      CLOUD_MEMORY_S3_BUCKET: ${CLOUD_MEMORY_S3_BUCKET:-}
      CLOUD_MEMORY_S3_PREFIX: ${CLOUD_MEMORY_S3_PREFIX:-triumph-cloud-memory}
      CLOUD_MEMORY_S3_REGION: ${CLOUD_MEMORY_S3_REGION:-us-east-1}
      CLOUD_MEMORY_S3_ENDPOINT: ${CLOUD_MEMORY_S3_ENDPOINT:-}
      CLOUD_MEMORY_S3_ACCESS_KEY_ID: ${CLOUD_MEMORY_S3_ACCESS_KEY_ID:-}
      CLOUD_MEMORY_S3_SECRET_ACCESS_KEY: ${CLOUD_MEMORY_S3_SECRET_ACCESS_KEY:-}
      APPLE_CLOUD_WEBDAV_ENABLED: ${APPLE_CLOUD_WEBDAV_ENABLED:-false}
      APPLE_CLOUD_WEBDAV_BASE_URL: ${APPLE_CLOUD_WEBDAV_BASE_URL:-}
      APPLE_CLOUD_WEBDAV_USERNAME: ${APPLE_CLOUD_WEBDAV_USERNAME:-}
      APPLE_CLOUD_WEBDAV_PASSWORD: ${APPLE_CLOUD_WEBDAV_PASSWORD:-}
      APPLE_CLOUD_WEBDAV_PATH: ${APPLE_CLOUD_WEBDAV_PATH:-/triumph-cloud-memory}
      SYNC_HTTP_TIMEOUT_S: ${CLOUD_MEMORY_SYNC_HTTP_TIMEOUT_S:-20}
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      CLOUD_MEMORY_REQUIRE_PQ: "true"
    volumes:
      - triumph_cloud_memory_backup:/backup
    expose:
      - "8095"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=20)"]
