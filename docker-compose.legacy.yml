      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(10); s.connect(('127.0.0.1',8093)); s.close()"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 120s

  # ========================================================================
  # TOKENIZATION ENGINE — Pi domain + allodial deed tokenization
  # ========================================================================

  tokenization-engine:
    build:
      context: .
      dockerfile: docker/tokenization-engine/Dockerfile
    container_name: triumph-tokenization-engine
    <<: *common
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.10
    environment:
      <<: [*db-env, *pi-env]
      NODE_OPTIONS: "--max-old-space-size=96"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
      TOKENIZATION_HMAC_KEY: ${TOKENIZATION_HMAC_KEY:-triumph-tokenization-fortress-2026}
