  # ========================================================================
  # ECOSYSTEM GUARDIAN — Unified Sovereign Watchdog Pod
  # Replaces three separate watchdog containers with ONE supervisord pod
  # for superior stability, lower memory footprint, and zero inter-watchdog
  # dependency failures.
  #
  # Subsystems managed internally by supervisord:
  #   health-governor  (port 9912) — container memory & health watchdog
  #   network-sentinel (port 9913) — multi-WAN connectivity monitor
  #   horizon-guardian (port 9911) — testnet2/Horizon process guardian
  #
  # Total memory: 192m (vs 240m for 3 separate containers)
  # Security: APEX-QUANTUM-SOVEREIGN (MAX) — ML-DSA-87 · ML-KEM-1024
  # ========================================================================
  ecosystem-guardian:
    build:
      context: docker/ecosystem-guardian
    container_name: triumph-ecosystem-guardian
    <<: *common
    restart: on-failure:10            # stop looping if Pi Node desktop is offline
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.18                        # ~same as 3 × 0.06 combined
    environment:
      # ── Health Governor config ────────────────────────────────────────
      GOVERNOR_INTERVAL_S: "30"
      MEMORY_WARN_PCT: "80"
      MEMORY_KILL_PCT: "101"
      METRICS_PORT: "9912"
      CONTAINER_PREFIX: "triumph-"
      PROTECTED_CONTAINERS: "triumph-postgres,triumph-redis"
      HEALTH_FAIL_THRESHOLD: "3"
      DOCKER_UNHEALTHY_THRESHOLD: "3"
      RESTART_BACKOFF_BASE_S: "60"
      RESTART_BACKOFF_MAX_S: "600"
      HEALTH_PROBE_TIMEOUT_S: "10"
      ML_SELF_HEAL_ENABLED: "true"
      ML_HISTORY_WINDOW_S: "900"
      ML_MAX_RESTARTS_PER_WINDOW: "4"
      ML_SUPPRESSION_S: "300"
      CONTROL_PLANE_REQUIRE_PQ_READY: "true"
      QUANTUM_SHIELD_URL: "http://triumph-quantum-shield:8094"
      SAIB_URL: http://triumph-sovereign-ai-bot:8099
      PQ_CHECK_INTERVAL_S: "30"
      # ── Network Sentinel config ───────────────────────────────────────
      PROBE_INTERVAL_S: "15"
      SENTINEL_METRICS_PORT: "9913"
      REDIS_URL: "redis://triumph-redis:6379"
      PI_NODE_HOST: "testnet2"
      PI_NODE_PEER_PORT: "31402"
      PI_HORIZON_URL: "http://testnet2:8000"
      PI_BRIDGE_URL: "http://triumph-pi-bridge-connector:8092"
      ML_ENGINE_URL: "http://triumph-ml-engine:8090"
      SELF_HEAL_ML_ENABLED: "true"
      ANOMALY_Z_THRESHOLD: "2.5"
      ANOMALY_STREAK_THRESHOLD: "3"
      # ── Horizon Guardian config ───────────────────────────────────────
      TARGET_CONTAINER: testnet2
      TARGET_PROCESS: horizon
      TARGET_URL: http://localhost:8000/
      GUARD_INTERVAL_S: "20"
      GUARDIAN_METRICS_PORT: "9911"
      PI_BRIDGE_NETWORK: pi-bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "9911"
      - "9912"
      - "9913"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9912/health', timeout=8)"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 20s

