[supervisord]
nodaemon=true
user=apex
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ============================================================================
# FORTRESS GROUP — 5 services
# ============================================================================

[program:ai-bot]
command=/usr/local/bin/uvicorn ai_bot:app --host 0.0.0.0 --port 8099 --log-level info --loop asyncio --http h11
directory=/app/fortress
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/ai-bot-stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/ai-bot-stderr.log
stderr_logfile_maxbytes=10MB
environment=PORT="8099",SERVICE_NAME="sovereign-ai-bot"

[program:gateway]
command=/usr/local/bin/python /app/fortress/gateway.py
directory=/app/fortress
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8097",SERVICE_NAME="sovereign-gateway"

[program:delivery]
command=/usr/local/bin/uvicorn delivery:app --host 0.0.0.0 --port 8100 --workers 1 --log-level info
directory=/app/fortress
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8100",SERVICE_NAME="sovereign-delivery-engine"

[program:pidex]
command=/usr/local/bin/uvicorn pidex:app --host 0.0.0.0 --port 8101 --workers 1 --log-level info
