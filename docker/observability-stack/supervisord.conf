[supervisord]
nodaemon=true
user=root

logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
username=supervisor
password=triumph_supervisor_local

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
username=supervisor
password=triumph_supervisor_local

[program:prometheus]
user=obs
command=/usr/local/bin/prometheus
  --config.file=/etc/prometheus/prometheus.yml
  --storage.tsdb.path=/prometheus
  --storage.tsdb.retention.time=30d
  --web.enable-lifecycle
  --web.listen-address=0.0.0.0:9090
directory=/prometheus
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:grafana]
user=obs
command=/usr/share/grafana/bin/grafana server
  --homepath=/usr/share/grafana
  --config=/etc/grafana/grafana.ini
  cfg:default.paths.data=/var/lib/grafana
  cfg:default.paths.logs=/var/log/grafana
  cfg:default.paths.plugins=/var/lib/grafana/plugins
  cfg:default.paths.provisioning=/etc/grafana/provisioning
  cfg:default.server.http_port=3000
directory=/usr/share/grafana
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=GF_PATHS_DATA="/var/lib/grafana",GF_PATHS_LOGS="/var/log/grafana",GF_PATHS_PROVISIONING="/etc/grafana/provisioning",GF_SECURITY_ADMIN_PASSWORD="%(ENV_GF_SECURITY_ADMIN_PASSWORD)s",GF_ANALYTICS_REPORTING_ENABLED="false",GF_ANALYTICS_CHECK_FOR_UPDATES="false",GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES="false",GF_DATABASE_WAL="true",GF_DATABASE_CACHE_MODE="shared"

[program:postgres-exporter]
user=obs
command=/usr/local/bin/postgres_exporter
  --web.listen-address=:9187
  --config.file=/etc/postgres_exporter.yml
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=DATA_SOURCE_NAME="%(ENV_DATA_SOURCE_NAME)s"

[program:redis-exporter]
user=obs
command=/usr/local/bin/redis_exporter
  -redis.addr=%(ENV_REDIS_ADDR)s
  -web.listen-address=:9121
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cloud-memory]
user=obs
command=/opt/cloud-memory/venv/bin/uvicorn main:app
  --host 0.0.0.0
  --port 8095
  --workers 1
  --loop uvloop
directory=/opt/cloud-memory
autostart=true
autorestart=true
startsecs=15
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8095",SERVICE_NAME="cloud-memory",REDIS_URL="%(ENV_REDIS_ADDR)s",DEFAULT_TTL_S="3600",HOT_TTL_S="300",WARM_TTL_S="3600",COLD_TTL_S="86400",LZ4_LEVEL="9",BACKUP_LOCAL_DIR="/backup/local",BACKUP_OFFLINE_DIR="/backup/offline"
