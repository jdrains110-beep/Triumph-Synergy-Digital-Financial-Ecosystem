# ==============================================================================
# PostgreSQL 16 — Triumph Synergy Digital Financial Ecosystem
# Optimized for: Pi Network blockchain throughput, GCV ledger, vector search,
#                SAIB real-time analytics, sovereign tenant transaction routing.
# Container: 256MB mem_limit / 0.5 CPU
# GCV constant: $314,159.00 / π — Pi Network mainnet SCP Protocol 24
# ==============================================================================

# ── Connections ────────────────────────────────────────────────────────────────
max_connections = 200                   # 22 services × ~8 pool connections
superuser_reserved_connections = 3

# ── Memory (tuned for 256 MB container) ───────────────────────────────────────
shared_buffers = 64MB                   # 25% of RAM — primary cache
effective_cache_size = 192MB            # query planner hint (75% of RAM)
work_mem = 8MB                          # per sort/hash — conservative for 200 conns
maintenance_work_mem = 48MB             # VACUUM, CREATE INDEX
wal_buffers = 16MB                      # WAL write buffer
temp_buffers = 8MB                      # per session temp table cache

# ── Write-Ahead Logging ────────────────────────────────────────────────────────
wal_level = replica                     # enables logical replication + streaming
wal_compression = zstd                  # PG16: zstd (better than lz4 for Pi ledger data)
max_wal_size = 512MB
min_wal_size = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min
wal_writer_delay = 200ms

# ── PG16 Logical Replication (for SAIB CDC) ────────────────────────────────────
max_replication_slots = 4
max_wal_senders = 4
wal_sender_timeout = 60s

# ── Query Planner ──────────────────────────────────────────────────────────────
random_page_cost = 1.1                  # SSD storage
effective_io_concurrency = 200          # SSD concurrent I/O
seq_page_cost = 1.0
default_statistics_target = 100

# ── Parallel Query (PG16) ──────────────────────────────────────────────────────
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 1
max_parallel_workers = 2
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0

# ── VACUUM / Autovacuum ────────────────────────────────────────────────────────
autovacuum = on
autovacuum_vacuum_cost_delay = 2ms      # PG16 default; faster than pg14
autovacuum_vacuum_scale_factor = 0.02   # vacuum more aggressively (2% threshold)
autovacuum_analyze_scale_factor = 0.01
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_max_workers = 3
autovacuum_naptime = 30s
vacuum_cost_page_hit = 1
vacuum_cost_page_miss = 10
vacuum_cost_limit = 400

# ── Connections (Public) ──────────────────────────────────────────────────────
listen_addresses = '*'                  # Accept from all Docker network interfaces

# ── Logging ───────────────────────────────────────────────────────────────────
log_min_duration_statement = 200        # log queries >200ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'
log_line_prefix = '%t [%p] %u@%d '
log_statement = 'ddl'                   # log schema changes
logging_collector = off                 # container stdout logging

# ── Monitoring / pg_stat_statements ───────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_stat_statements.track_utility = on
track_io_timing = on
track_functions = all

# ── Timezone / Locale ──────────────────────────────────────────────────────────
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# ── PG16 New Features ──────────────────────────────────────────────────────────
# Logical replication publisher identity for SAIB CDC
wal_log_hints = on

# Allow ICU collations (PG16 default provider)
# icu_validation_level = warning

# ── Security ──────────────────────────────────────────────────────────────────
ssl = off                               # SSL handled by nginx at edge
password_encryption = scram-sha-256
