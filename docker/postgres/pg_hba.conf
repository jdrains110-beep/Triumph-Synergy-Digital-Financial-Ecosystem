# PostgreSQL Client Authentication Configuration
# ============================================================================
# FORMAT: TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# Triumph Synergy — accepts connections from triumph-net Docker bridge
# ============================================================================

# Local connections
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Docker network (triumph-net bridge)
host    all             all             172.17.0.0/16           md5
host    all             all             172.18.0.0/16           md5
host    all             all             172.19.0.0/16           md5
host    all             all             172.20.0.0/16           md5
host    all             all             172.21.0.0/16           md5

# IPv6 loopback
host    all             all             ::1/128                 md5

# Allow all IPv4/IPv6 (for docker internal traffic)
host    all             all             0.0.0.0/0               md5
host    all             all             ::/0                    md5
