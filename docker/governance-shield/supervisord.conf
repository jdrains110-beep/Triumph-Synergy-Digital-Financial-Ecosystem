[supervisord]
nodaemon=true
user=govern
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ============================================================================
# GOVERNANCE-SHIELD SUPER-POD
# Embedded Pi Mainnet SCP v24 Protocol Engine via Node.js
# ============================================================================
[program:compliance]
command=node /app/dist/compliance.js
directory=/app
autostart=true
autorestart=true
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8087",SERVICE_NAME="compliance",PI_PROTOCOL_VERSION="24"

[program:judicial-monitor]
command=node /app/dist/judicial-monitor.js
directory=/app
autostart=true
autorestart=true
priority=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8096",SERVICE_NAME="judicial-monitor",PI_PROTOCOL_VERSION="24"

[program:central-node]
command=node /app/dist/central-node.js
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=SERVICE_NAME="central-node",PI_PROTOCOL_VERSION="24",STELLAR_CORE_VERSION="v24.0.0",STELLAR_CORE_NETWORK="Pi Network",NODE_ENV="production"

[program:scp-upgrader]
command=node /app/dist/scp-upgrader.js
directory=/app
autostart=true
autorestart=true
priority=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8083",SERVICE_NAME="scp-upgrader",PI_PROTOCOL_VERSION="24"
