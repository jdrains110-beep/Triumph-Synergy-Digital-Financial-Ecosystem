# ============================================================================
# STELLAR CORE CONFIGURATION — Pi Mainnet SCP Protocol 24
# ============================================================================
# Embedded directly in governance-shield (central-node motherboard)
# This is the AUTHORITATIVE stellar-core for the Triumph Synergy supernode.
# ============================================================================

# Network configuration
NETWORK_PASSPHRASE="Pi Network"

# Database — local SQLite for pi mainnet ledger state
DATABASE="sqlite3:///app/data/stellar-core/stellar.db"

# HTTP server (exposed for /info endpoint at port 11626)
HTTP_PORT=11626
UNSAFE_QUORUM=false
DISABLE_TX_QUEUE_LIMITS=false

# Ledger — testnet to validate against public network
# Note: We validate as a participant, not a full hub
ARTIFICIALLY_ACCELERATE_TIME_FOR_TESTING=false

# Peer discovery — join the Pi mainnet SCP mesh
PEER_PORT=11625
PUBLIC_HTTP_PORT=11626

# Pi Network validators (well-known validators for mainnet SCP 24)
[QUORUM_SET]
THRESHOLD_PERCENT=51
VALIDATORS=[
  "GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V", # Triumph Central Node
  "GBJCHUKZMTFSLOMNC7P4TS4VJJBTCYL3XKSOLXAUJERUZKCHAO5ZCZ63", # Pi Foundation Validator 1
  "GDZST3XVCDTUJ76ZAV2HA72KYPH5475WCQLOTZ3CKLEY6YC6LQ5KEPL2",  # Pi Foundation Validator 2
  "GBW4TGQTQYQM4XDQY4BPBQ5TPBZK3YKVHJZ6LN5PWKGXHVYV3ZCLL6K", # Pi Foundation Validator 3
]

# Command line HTTP admin server
COMMANDS=["http://127.0.0.1:11627"]

# Stellar Core logs to stdout (supervisord captures)
LOG_FILE_PATH="/var/log/stellar-core/stellar-core.log"

# Testing/validation options
MANUAL_CLOSE=false

# Advanced SCP tuning for Protocol 24
SCP_STRICT_ORDERING_DISABLED=false

# Enable history archive (optional — depends on your infrastructure)
# HISTORY={"archive": {"get": "curl --compressed -sf http://history.mainnet.minepi.com/{0} -o {1}"}}
