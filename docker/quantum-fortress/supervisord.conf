[supervisord]
nodaemon=true
user=quantum
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:quantum-shield]
command=/usr/local/bin/uvicorn shield:app --host 0.0.0.0 --port 8094 --workers 1 --loop uvloop --no-access-log
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8094",SERVICE_NAME="quantum-shield",LD_LIBRARY_PATH="/usr/local/liboqs/lib"

[program:qpu-bridge]
command=/usr/local/bin/uvicorn qpu:app --host 0.0.0.0 --port 8098 --workers 1 --loop uvloop --no-access-log
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8098",SERVICE_NAME="qpu-bridge",LD_LIBRARY_PATH="/usr/local/liboqs/lib"
