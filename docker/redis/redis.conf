# Triumph Synergy Redis -- Maximized for 22-service mesh
# Network
bind 0.0.0.0
port 6379
tcp-backlog 1024
timeout 0
tcp-keepalive 60

# Memory -- 112mb ceiling inside 128m container limit
maxmemory 112mb
maxmemory-policy allkeys-lru
maxmemory-samples 10
activerehashing yes

# Clients -- 2000 covers all 22 services at peak
maxclients 2000

# Multi-threaded I/O (Redis 6+)
io-threads 4
io-threads-do-reads yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# High-frequency timer for payment + DEX feeds
hz 100
dynamic-hz yes

# AOF persistence -- everysec balances durability and performance
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 50
auto-aof-rewrite-min-size 32mb

# RDB snapshots
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 256

# Logging
loglevel notice