# Pi Network Redis Configuration
# ==============================================================================

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory — must be less than container mem_limit (128m)
maxmemory 96mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Performance
hz 10
maxclients 100000

# Logging
loglevel notice
