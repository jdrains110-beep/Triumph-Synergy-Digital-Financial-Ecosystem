; ==========================================================================
; TRIUMPH SYNERGY — APEX-SOVEREIGN-LIFE supervisord.conf
; Three apex sovereign services co-located for in-pod localhost communication:
;   bank      — port 8150 (Sovereign Pi Bank — full-reserve, 0%, anti-cartel)
;   education — port 8130 (K-12, college, faculty pay, learn-and-earn)
;   telecom   — port 8140 (7-layer quantum mesh)
; ==========================================================================

[supervisord]
nodaemon=true
user=sovlife
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:bank]
command=/usr/local/bin/uvicorn bank:app --host 0.0.0.0 --port 8150 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8150",SERVICE_NAME="sovereign-bank"

[program:education]
command=/usr/local/bin/uvicorn education:app --host 0.0.0.0 --port 8130 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8130",SERVICE_NAME="sovereign-education"

[program:telecom]
command=/usr/local/bin/uvicorn telecom:app --host 0.0.0.0 --port 8140 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8140",SERVICE_NAME="sovereign-telecom"
