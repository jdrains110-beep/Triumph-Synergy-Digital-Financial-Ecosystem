[supervisord]
nodaemon=true
user=sovereign
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:ai-bot]
command=/usr/local/bin/uvicorn ai_bot:app --host 0.0.0.0 --port 8099 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8099",SERVICE_NAME="sovereign-ai-bot"

[program:gateway]
command=/usr/local/bin/python /app/gateway.py
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8097",SERVICE_NAME="sovereign-gateway"

[program:delivery]
command=/usr/local/bin/uvicorn delivery:app --host 0.0.0.0 --port 8100 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
