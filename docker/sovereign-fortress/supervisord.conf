stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8101",SERVICE_NAME="sovereign-pidex-engine"

[program:sports]
command=/usr/local/bin/uvicorn sports:app --host 0.0.0.0 --port 8102 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
stopasgroup=true
