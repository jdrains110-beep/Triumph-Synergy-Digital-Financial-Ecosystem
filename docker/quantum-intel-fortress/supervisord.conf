; ==============================================================================
; QUANTUM-INTEL-FORTRESS supervisord.conf
; 5 services: financial-intel (8090/8091/8093) + quantum-fortress (8094/8098)
; ==============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── ML-Engine (8090) ──────────────────────────────────────────────────────────
[program:ml-engine]
command=/usr/local/bin/uvicorn ml:app --host 0.0.0.0 --port 8090 --loop asyncio --no-access-log
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8090",SERVICE_NAME="ml-engine"

; ── Credit-Engine (8091) ──────────────────────────────────────────────────────
[program:credit-engine]
command=/usr/local/bin/uvicorn credit:app --host 0.0.0.0 --port 8091 --loop asyncio --no-access-log
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8091",SERVICE_NAME="credit-engine"

; ── Dual-Value-Engine (8093) ──────────────────────────────────────────────────
[program:dual-value-engine]
command=/usr/local/bin/uvicorn dual_value:app --host 0.0.0.0 --port 8093 --loop asyncio --no-access-log
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8093",SERVICE_NAME="dual-value-engine"

; ── Quantum-Shield (8094) ─────────────────────────────────────────────────────
[program:quantum-shield]
command=/usr/local/bin/uvicorn shield:app --host 0.0.0.0 --port 8094 --loop asyncio --no-access-log
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8094",SERVICE_NAME="quantum-shield",LD_LIBRARY_PATH="/usr/local/liboqs/lib"

; ── QPU-Bridge (8098) ─────────────────────────────────────────────────────────
[program:qpu-bridge]
command=/usr/local/bin/uvicorn qpu:app --host 0.0.0.0 --port 8098 --loop asyncio --no-access-log
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8098",SERVICE_NAME="qpu-bridge",LD_LIBRARY_PATH="/usr/local/liboqs/lib"
