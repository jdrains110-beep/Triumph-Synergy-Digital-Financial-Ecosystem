groups:
  - name: triumph-synergy-availability
    rules:
      - alert: TriumphServiceDown
        expr: up{job=~"triumph-.*|pi-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service down: {{ $labels.job }}"
          description: "Prometheus cannot scrape {{ $labels.instance }} for job {{ $labels.job }}."

      - alert: PrometheusTargetScrapeLatencyHigh
        expr: max_over_time(scrape_duration_seconds{job=~"triumph-.*|pi-.*"}[5m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scrape latency: {{ $labels.job }}"
          description: "Scrape duration for {{ $labels.instance }} exceeded 3s over the last 5m."

  - name: triumph-synergy-congestion
    rules:
      - alert: PrometheusIngestionSpike
        expr: rate(prometheus_tsdb_head_samples_appended_total[5m]) > 20000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High metrics ingestion rate"
          description: "Prometheus sample ingestion rate is above 20k samples/sec for 10m."

      - alert: RedisExporterUnavailable
        expr: up{job="pi-redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis exporter unavailable"
          description: "Redis exporter target is down; cache visibility is lost."

      - alert: PostgresExporterUnavailable
        expr: up{job="pi-postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter unavailable"
          description: "Postgres exporter target is down; DB visibility is lost."

      - alert: HorizonGuardianRecoveryDetected
        expr: increase(triumph_horizon_guardian_recoveries_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Horizon guardian performed a recovery"
          description: "The horizon-guardian restarted or attempted to restart Horizon inside testnet2 within the last 10 minutes."

      - alert: HorizonGuardianRecoveryStorm
        expr: increase(triumph_horizon_guardian_recoveries_total[10m]) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Repeated Horizon recoveries detected"
          description: "The horizon-guardian has performed 3 or more recovery attempts in the last 10 minutes, indicating unstable Pi Horizon availability."

      - alert: CloudMemorySyncFailure
        expr: increase(mem_sync_runs_total{target=~"s3|apple_webdav|sync",status="error"}[15m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Cloud memory sync target failure"
          description: "Cloud/offline memory sync reported at least one error in the last 15 minutes."

      - alert: CloudMemorySyncStale
        expr: (time() - max(mem_sync_last_success_epoch_seconds{target="local"})) > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cloud memory local snapshot stale"
          description: "No successful local memory snapshot sync for over 30 minutes."

      - alert: QuantumBackboneDisconnected
        expr: quantum_backbone_connected{job="triumph-quantum-shield"} == 0
        for: 45s
        labels:
          severity: critical
        annotations:
          summary: "Quantum motherboard backbone disconnected"
          description: "Quantum backbone connection has been down for more than 45 seconds on {{ $labels.instance }}."

  - name: triumph-synergy-resilience
    rules:
      - alert: PQGateUnavailable
        expr: (triumph_governor_pq_ready == 0) or (triumph_sentinel_pq_ready == 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Post-quantum gate offline — autonomous self-healing blocked"
          description: "The PQ control-plane gate has been down for >5 minutes on {{ $labels.instance }}. Autonomous recovery is suspended until the quantum-shield restores PQ readiness."

      - alert: MLSelfHealDisabled
        expr: (triumph_governor_ml_self_heal_enabled == 0) or (triumph_sentinel_ml_enabled == 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ML self-heal engine disabled"
          description: "The ML-guided self-healing layer has been off for >10 minutes on {{ $labels.instance }}. Adaptive anomaly suppression is inactive."

      - alert: GovernorRestartStorm
        expr: sum(rate(triumph_governor_restarts_total[10m])) > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Health governor restart storm detected"
          description: "The health governor is restarting containers faster than 0.5/min over the last 10 minutes. Possible systemic instability."

      - alert: SentinelHighAnomalyScore
        expr: triumph_sentinel_ml_anomaly_score > 3
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Network sentinel anomaly score elevated"
          description: "ML anomaly score is {{ $value | humanize }} (threshold 3) on {{ $labels.instance }} for >3m. Network may be degraded or under stress."
