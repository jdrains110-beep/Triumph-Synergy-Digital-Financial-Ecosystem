[supervisord]
nodaemon=true
user=fintel
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:credit-engine]
command=/usr/local/bin/uvicorn credit:app --host 0.0.0.0 --port 8091 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8091",SERVICE_NAME="credit-engine"

[program:ml-engine]
command=/usr/local/bin/uvicorn ml:app --host 0.0.0.0 --port 8090 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8090",SERVICE_NAME="ml-engine"

[program:dual-value-engine]
command=/usr/local/bin/uvicorn dual_value:app --host 0.0.0.0 --port 8093 --workers 1 --log-level info
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT="8093",SERVICE_NAME="dual-value-engine"
