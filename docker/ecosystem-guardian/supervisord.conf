; Manages four co-located watchdog processes:
;   governor      — container memory & health watchdog (port 9912)
;   sentinel      — multi-WAN network monitor          (port 9913)
;   hg-watchdog   — pi-mainnet-node horizon shell guardian    (writes metrics file)
;   hg-metrics    — metrics HTTP server for guardian   (port 9911)
; ==========================================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── Health Governor (port 9912) ────────────────────────────────────────────
[program:governor]
command=python3 -u /app/governor.py
environment=METRICS_PORT="9912"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ── Network Sentinel (port 9913) ──────────────────────────────────────────
[program:sentinel]
command=python3 -u /app/sentinel.py
environment=METRICS_PORT="9913"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ── Horizon Guardian watchdog (shell — writes /app/metrics/metrics) ────────
[program:hg-watchdog]
command=/app/watchdog.sh
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ── Horizon Guardian metrics server (port 9911) ────────────────────────────
[program:hg-metrics]
command=python3 -u /app/metrics_server.py
environment=METRICS_PORT="9911"
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
