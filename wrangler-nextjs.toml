name = "triumph-synergy-quantum"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Account Configuration
account_id = "5d6f808f4561a69a80490838b28cd9ed"
workers_dev = true

# Custom domain routes — triumphsynergy.com is transferred to Cloudflare
[[routes]]
pattern = "triumphsynergy.com/*"
custom_domain = true

[[routes]]
pattern = "www.triumphsynergy.com/*"
custom_domain = true

# Static assets served from .open-next/assets
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# KV Namespace Bindings (SAIB vault and backup)
[[kv_namespaces]]
binding = "SAIB_BACKUP_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

# R2 Bucket Bindings (SAIB vault storage)
[[r2_buckets]]
binding = "SAIB_VAULT_R2"
bucket_name = "saib-vault-production"
preview_bucket_name = "saib-vault-preview"

# Build configuration — uses opennextjs/cloudflare
[build]
command = "npx @opennextjs/cloudflare build"
cwd = "./"

# Triggers and routes (if using Cron)
[[triggers.crons]]
cron = "0 0 * * *"

# Top-level vars
[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_PI_RPC_MAINNET = "https://rpc.minepi.com"
NEXT_PUBLIC_PI_RPC_TESTNET = "https://rpc.testnet.minepi.com"

# Note: Secret environment variables (SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY)
# should be set via: wrangler secret put SECRET_NAME
