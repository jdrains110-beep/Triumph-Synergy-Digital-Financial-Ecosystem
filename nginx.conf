events {
    worker_connections 1024;
}

http {
    upstream app_servers {
        least_conn;
        server triumph-app:3000 max_fails=3 fail_timeout=30s;
    }

    # ── Microservice upstreams ──────────────────────────────────────────────
    upstream market_data {
        server triumph-market-data:8085 max_fails=3 fail_timeout=30s;
    }
    upstream blockchain_oracle {
        server triumph-blockchain-oracle:8086 max_fails=3 fail_timeout=30s;
    }
    upstream compliance {
        server triumph-compliance:8087 max_fails=3 fail_timeout=30s;
    }
    upstream dex {
        server triumph-dex:8088 max_fails=3 fail_timeout=30s;
    }
    upstream transaction_engine {
        server triumph-transaction-engine:8080 max_fails=3 fail_timeout=30s;
    }
    upstream payment_processor {
        server triumph-payment-processor:8084 max_fails=3 fail_timeout=30s;
    }
    upstream vault {
        server triumph-vault:8081 max_fails=3 fail_timeout=30s;
    }
    upstream smart_contracts {
        server triumph-smart-contracts:8082 max_fails=3 fail_timeout=30s;
    }
    upstream scp_upgrader {
        server triumph-scp-upgrader:8083 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting for Pi payments
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/s;

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=50m inactive=60m use_temp_path=off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Hide server version
        server_tokens off;

        # Increase buffer sizes for large requests
        client_max_body_size 10M;
        client_body_buffer_size 128k;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

        # Main application
        location / {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Pi Payment API with rate limiting
        location /api/pi/payment {
            limit_req zone=payment_limit burst=200 nodelay;
            
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # No caching for payment endpoints
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Smart Contract webhook
        location /api/contracts/webhook {
            limit_req zone=api_limit burst=500;
            
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Hub-Signature $http_x_hub_signature;
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://app_servers;
        }

        # Cache static assets
        location /_next/static {
            proxy_cache api_cache;
            proxy_cache_valid 200 60m;
            proxy_pass http://app_servers;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Microservice API routes ─────────────────────────────────────────

        # Market Data — live Pi price, volume, OHLCV
        location /services/market-data/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://market_data/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Blockchain Oracle — ledger events, SSE stream
        location /services/oracle/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://blockchain_oracle/;
            proxy_http_version 1.1;
            # SSE support
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Compliance — KYC/AML verification
        location /services/compliance/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://compliance/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # DEX — token swap quotes and execution
        location /services/dex/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://dex/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Transaction Engine
        location /services/transactions/ {
            limit_req zone=api_limit burst=500 nodelay;
            proxy_pass http://transaction_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Payment Processor
        location /services/payments/ {
            limit_req zone=payment_limit burst=200 nodelay;
            proxy_pass http://payment_processor/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Vault
        location /services/vault/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://vault/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Smart Contracts
        location /services/contracts/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://smart_contracts/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SCP Upgrader
        location /services/scp/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://scp_upgrader/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
