events {
    worker_connections 1024;           # balanced — 22 services, not a public CDN
    multi_accept on;                   # accept all new connections at once
    use epoll;                         # Linux epoll — fastest I/O multiplexing
}

worker_processes 1;                    # fixed at 1 — prevents CPU spike on Docker Desktop (auto spawns 1 worker per core)
worker_rlimit_nofile 65535;             # max open files per worker

http {
    # WebSocket upgrade map (required for WS proxy_set_header Connection)
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ""        close;
    }

    # ── Connection Performance ──────────────────────────────────────────────
    keepalive_timeout          75s;    # keep upstream connections warm
    keepalive_requests         2000;   # reuse connections heavily
    sendfile                   on;
    tcp_nopush                 on;
    tcp_nodelay                on;     # disable Nagle for low-latency Pi payments
    reset_timedout_connection  on;     # free memory from timed-out clients

    # ── Upstream Connection Pools ───────────────────────────────────────────
    # DNS resolver for Docker internal DNS — re-resolves when containers restart
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Persistent keepalive pools to each microservice (avoids TCP handshake per request)
    # triumph-app is on the triumph-net network and resolves correctly.
    upstream app_servers {
        least_conn;
        server triumph-app:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream market_data {
        server triumph-horizon-stream:8085 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream blockchain_oracle {
        server triumph-horizon-stream:8086 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream compliance {
        server triumph-governance-shield:8087 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream dex {
        server triumph-settlement-core:8088 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream tokenization_engine {
        server triumph-settlement-core:8089 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream ml_engine {
        server triumph-financial-intel:8090 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream credit_engine {
        server triumph-financial-intel:8091 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream pi_bridge_connector {
        server triumph-pi-bridge-connector:8092 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream dual_value_engine {
        server triumph-financial-intel:8093 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream quantum_shield {
        server triumph-quantum-fortress:8094 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream cloud_memory {
        server triumph-observability-stack:8095 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream judicial_monitor {
        server triumph-governance-shield:8096 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream transaction_engine {
        server triumph-settlement-core:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    upstream payment_processor {
        server triumph-settlement-core:8084 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream vault {
        server triumph-vault:8081 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream smart_contracts {
        server triumph-settlement-core:8082 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream scp_upgrader {
        server triumph-governance-shield:8083 max_fails=3 fail_timeout=30s;
        keepalive 4;
    }

    upstream qpu_bridge {
        server triumph-quantum-fortress:8098 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Sovereign Military Bridge — CNSA Suite 2.0 federation gateway
    upstream sovereign_military_bridge {
        server triumph-sovereign-military-bridge:8199 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Sovereign Insurance super-pod (life/home/health/auto/dental/vision/hospital)
    upstream sovereign_life     { server triumph-sovereign-insurance:8110 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_home_ins { server triumph-sovereign-insurance:8111 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_health   { server triumph-sovereign-insurance:8112 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_auto     { server triumph-sovereign-insurance:8113 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_dental   { server triumph-sovereign-insurance:8114 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_vision   { server triumph-sovereign-insurance:8115 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_hospital { server triumph-sovereign-insurance:8116 max_fails=3 fail_timeout=30s; keepalive 8; }

    # Sovereign Utilities super-pod (electric/water/gas/hoa/plumbing/hvac)
    upstream sovereign_electric { server triumph-sovereign-utilities:8120 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_water    { server triumph-sovereign-utilities:8121 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_gas      { server triumph-sovereign-utilities:8122 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_hoa      { server triumph-sovereign-utilities:8123 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_plumbing { server triumph-sovereign-utilities:8124 max_fails=3 fail_timeout=30s; keepalive 8; }
    upstream sovereign_hvac     { server triumph-sovereign-utilities:8125 max_fails=3 fail_timeout=30s; keepalive 8; }

    # SAIB Enforcer — sidecar bridge to credit bureaus, judicial systems, tokenization, HQ, vault.
    upstream saib_enforcer {
        server triumph-saib-enforcer:8210 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Triumph Court Nexus — PiRC judicial engine, escrow enforcement, anti-fraud, credit liquidation.
    # Routes to triumph-governance-shield (judicial_monitor on 8096) until triumph-court-nexus
    # is deployed as a standalone service on 8095.
    upstream triumph_court_nexus {
        server triumph-governance-shield:8096 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # Rate limiting for Pi payments
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/s;

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=50m inactive=60m use_temp_path=off;

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/server-cert.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Security headers — quantum-hardened posture
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Quantum-resistance disclosure headers
        add_header X-Quantum-Shield "CRYSTALS-Kyber-1024|Dilithium-5|SPHINCS+-SHAKE-256f" always;
        add_header X-Pi-Dual-Value "internal=314159|external=314.159|multiplier=1000x" always;
        add_header X-Triumph-Sovereignty "Jeremiah-Joel-Drains|Allodial-Perfected|Debt-Free" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.minepi.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: https://api.minepi.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Hide server version
        server_tokens off;

        # Increase buffer sizes for large requests
        client_max_body_size 10M;
        client_body_buffer_size 128k;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

        # Main application
        location / {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Pi Payment API with rate limiting
        location /api/pi/payment {
            limit_req zone=payment_limit burst=200 nodelay;
            
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # No caching for payment endpoints
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Smart Contract webhook
        location /api/contracts/webhook {
            limit_req zone=api_limit burst=500;
            
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Hub-Signature $http_x_hub_signature;
        }

        # Health check endpoint — respond directly without proxying
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # Cache static assets
        location /_next/static {
            proxy_cache api_cache;
            proxy_cache_valid 200 60m;
            proxy_pass http://app_servers;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Microservice API routes ─────────────────────────────────────────

        # Market Data — live Pi price, volume, OHLCV
        location /services/market-data/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://market_data/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Sovereign Military Bridge — CNSA 2.0 federation + sovereign routing
        # Replit / external stacks reach the mesh via:
        #   curl -H "Authorization: Bearer $SMB_PUBLIC_BRIDGE_TOKEN" \
        #        https://<host>/services/military-bridge/<endpoint>
        # Auth is enforced inside the bridge container (per-endpoint).
        location /services/military-bridge/ {
            limit_req zone=api_limit burst=500 nodelay;
            proxy_pass http://sovereign_military_bridge/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Bridge-Token  $http_x_bridge_token;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }
        # Sovereign Nano SAIB — apex defense + Unreal Engine threat-graph WS
        location /services/nano-saib/ {
            limit_req zone=api_limit burst=500 nodelay;
            set $nano_saib_upstream http://triumph-sovereign-nano-saib:8201;
            rewrite ^/services/nano-saib/(.*) /$1 break;
            proxy_pass $nano_saib_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Bridge-Token  $http_x_bridge_token;
            # WebSocket upgrade for /ws/threat-graph
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;  # keep WS alive
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }
        # Blockchain Oracle — ledger events, SSE stream
        location /services/oracle/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://blockchain_oracle/;
            proxy_http_version 1.1;
            # SSE support
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Compliance — KYC/AML verification
        location /services/compliance/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://compliance/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # DEX — token swap quotes and execution
        location /services/dex/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://dex/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Transaction Engine
        location /services/transactions/ {
            limit_req zone=api_limit burst=500 nodelay;
            proxy_pass http://transaction_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Payment Processor
        location /services/payments/ {
            limit_req zone=payment_limit burst=200 nodelay;
            proxy_pass http://payment_processor/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Vault
        location /services/vault/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://vault/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Smart Contracts
        location /services/contracts/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://smart_contracts/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SCP Upgrader
        location /services/scp/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://scp_upgrader/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Pi Bridge Connector — Central Node <-> Pi Node (testnet2) live SCP + ledger bridge
        location /services/pi-bridge/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://pi_bridge_connector/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            add_header X-Triumph-Bridge-Node "triumph-central-node<->testnet2" always;
        }

        # Dual-Value Engine — Pi internal (mined) vs external (market) value
        location /services/dual-value/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://dual_value_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            add_header X-Pi-Dual-Value "triumph-synergy" always;
        }

        # Cloud Memory Platform — LZ4 compressed unified multi-platform store
        location /services/memory/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://cloud_memory/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            add_header X-Cloud-Memory "LZ4|dedup|22-namespaces" always;
        }

        # Credit Engine — PiCredit Score™ + Equifax/Experian/TransUnion/FICO/VantageScore
        location /services/credit/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://credit_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # ML Engine — IsolationForest anomaly, GBM fraud, Ridge price, RSI sentiment
        location /services/ml/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://ml_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Tokenization Engine — Pi domain + allodial deed tokens
        location /services/tokenization/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://tokenization_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Quantum Backbone — live backbone status from quantum-shield
        location /api/quantum/backbone {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://quantum_shield/quantum/backbone/status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            add_header X-Quantum-Backbone "live" always;
        }

        # Quantum Shield — NIST FIPS 203/204/205 post-quantum cryptography
        location /services/quantum/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://quantum_shield/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            add_header X-Quantum-Algorithm "CRYSTALS-Kyber-1024|Dilithium-5|AES-256-GCM" always;
        }

        # Alias routes — legacy/alternate names probed by watchdog/SAIB
        location /services/quantum-shield/ {
            proxy_pass http://quantum_shield/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /services/smart-contracts/ {
            proxy_pass http://smart_contracts/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /services/settlement/ {
            proxy_pass http://transaction_engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Judicial Monitor — Courtroom Transparency & Anti-Railroading (Florida-first)
        location /services/judicial/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://judicial_monitor/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            add_header X-Triumph-Judicial "anti-railroading|anti-stacking|transparency" always;
        }

        # Judicial API direct route — for Next.js app /api/judicial proxying
        location /api/judicial/service/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://judicial_monitor/api/judicial/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # SAIB Enforcer — bridge between real-world (credit bureaus, judicial,
        # tokenization, HQ, vault) and the Triumph Synergy digital ecosystem.
        # Founder-token gated for all mutating actions. Every action emits an
        # immutable sha256 receipt anchored to Pi mainnet.
        location /api/saib/enforce {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://saib_enforcer/api/saib/enforce;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            proxy_read_timeout 30s;
            add_header X-SAIB-Enforcer "real-to-digital-bridge" always;
        }

        # SAIB Live Ledger — Pi mainnet GCV transaction feed (REST snapshot)
        # Returns live Pi blockchain transactions tagged with GCV ($314,159/π).
        location /api/saib/live-ledger {
            limit_req zone=api_limit burst=500 nodelay;
            proxy_pass http://saib_enforcer/live-ledger;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            proxy_read_timeout 15s;
            add_header X-SAIB-Live-Ledger "gcv-314159" always;
        }

        # SAIB Live Ledger SSE Stream — real-time Pi mainnet push events
        # Server-Sent Events: connect once, receive every new ledger block.
        location /api/saib/live-ledger/stream {
            proxy_pass http://saib_enforcer/live-ledger/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";          # disable keep-alive upgrade for SSE
            proxy_cache off;
            proxy_buffering off;                     # CRITICAL: SSE requires unbuffered streaming
            proxy_read_timeout 3600s;                # hold stream for up to 1 hour
            add_header X-SAIB-Live-Ledger "sse-stream" always;
            add_header Cache-Control "no-store" always;
        }

        # QPU Bridge — Quantum superposition + entanglement + circuit processing
        location /services/qpu/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://qpu_bridge/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
            proxy_read_timeout 120s;
            add_header X-QPU-Bridge "superposition|entanglement|circuit|sovereign" always;
        }

        # ====================================================================
        # SOVEREIGN INSURANCE — life / home / health / auto / dental / vision / hospital
        # ====================================================================
        location /insurance/life/      { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_life/;     proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Insurance "life" always; }
        location /insurance/home/      { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_home_ins/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Insurance "home" always; }
        location /insurance/health/    { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_health/;   proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Insurance "health" always; }
        location /insurance/auto/      { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_auto/;     proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Insurance "auto" always; }
        location /insurance/dental/    { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_dental/;   proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Insurance "dental" always; }
        location /insurance/vision/    { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_vision/;   proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Insurance "vision" always; }
        location /insurance/hospital/  { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_hospital/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Insurance "hospital" always; }

        # ====================================================================
        # SOVEREIGN UTILITIES — electric / water / gas / hoa / plumbing / hvac
        # ====================================================================
        location /utilities/electric/  { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_electric/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Utility "electric" always; }
        location /utilities/water/     { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_water/;    proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Utility "water" always; }
        location /utilities/gas/       { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_gas/;      proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Utility "gas" always; }
        location /utilities/hoa/       { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_hoa/;      proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Utility "hoa" always; }
        location /utilities/plumbing/  { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_plumbing/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Utility "plumbing" always; }
        location /utilities/hvac/      { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://sovereign_hvac/;     proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header X-Sovereign-Utility "hvac" always; }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # DYNAMIC MULTI-TENANT .pi CASCADING ENGINE
    # Single wildcard server block replaces 22 individual static blocks.
    # Regex captures the subdomain name → injected as X-Triumph-Tenant so
    # the Next.js app can render the correct tenant storefront dynamically.
    #
    # Routes:
    #   /                    → triumph-app:3000  (tenant-aware Next.js UI)
    #   /api/v2/settlement   → triumph-settlement-core:8089  (GCV $314,159/Pi)
    #   /api/v2/judicial     → triumph-governance-shield:8096 (PiRC court nexus)
    #   /api/settlement      → triumph-settlement-core:8089  (legacy compat)
    # ═══════════════════════════════════════════════════════════════════════

    server {
        listen 80;
        listen [::]:80;
        # Regex-only match: captures subdomain into $subdomain variable.
        # Handles: wingstop.pi, netjets.pi, triumphsynergy.pi, etc.
        server_name ~^(?<subdomain>[^.]+)\.pi$;

        # ── Security headers ─────────────────────────────────────────────
        add_header X-Frame-Options           "DENY"                                                        always;
        add_header X-Content-Type-Options    "nosniff"                                                     always;
        add_header X-XSS-Protection          "1; mode=block"                                               always;
        add_header Content-Security-Policy   "default-src 'self' http: data: 'unsafe-inline' 'unsafe-eval';" always;
        add_header X-Sovereign-Ecosystem     "triumph-synergy-gcv-314159"                                   always;

        # ── 1. Dynamic tenant storefront (Next.js reads X-Triumph-Tenant) ─
        location / {
            proxy_pass         http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Triumph-Tenant  $subdomain;
        }

        # ── 2. GCV Gold-Backed Settlement v2 (Pi SDK 2.0) ────────────────
        location /api/v2/settlement {
            proxy_pass         http://tokenization_engine/api/settlement;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Tenant-Domain  $subdomain;
            proxy_set_header   X-Pi-Domain      "$subdomain.pi";
        }

        # ── 3. PiRC Judicial & Credit Compliance Matrix ───────────────────
        location /api/v2/judicial {
            proxy_pass         http://triumph_court_nexus/api/judicial;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Tenant-Domain  $subdomain;
        }

        # ── 4. Legacy settlement path (backwards compat) ─────────────────
        location /api/settlement {
            proxy_pass         http://tokenization_engine;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Pi-Domain      "$subdomain.pi";
        }
    }

    # ── Master Hub — catch-all default_server ────────────────────────────────
    # Serves the ecosystem directory for any unmatched .pi or localhost request.
    # NOTE: The primary app server block above uses listen 80 without default_server,
    # so this block is the fallback for all unrecognised Host headers.
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html/master_hub;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }
}
