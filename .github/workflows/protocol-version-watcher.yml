name: 🛰️ Pi Protocol Version Watcher

# Polls Pi Network mainnet Horizon for the current Stellar Consensus Protocol
# version. When Pi advances (e.g. 23 -> 24), opens a PR bumping
# lib/pi-network/constants.ts, public/.well-known/stellar.toml and
# infrastructure/history-archive/stellar-history.seed.json.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    name: Detect & propose protocol bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run protocol auto-update
        id: bump
        env:
          PI_HORIZON_URL: https://api.mainnet.minepi.com
        run: node scripts/protocol-auto-update.js

      - name: Detect changes
        id: diff
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(protocol): auto-bump Pi mainnet protocol version"
          title: "chore(protocol): auto-bump Pi mainnet protocol version"
          body: |
            Pi Network mainnet Horizon is reporting a newer
            `current_protocol_version` than the version pinned in this
            repository. This PR bumps:

            - `lib/pi-network/constants.ts`
            - `public/.well-known/stellar.toml`
            - `infrastructure/history-archive/stellar-history.seed.json`

            Generated by `.github/workflows/protocol-version-watcher.yml`.
          branch: chore/protocol-auto-bump
          delete-branch: true
          labels: automation,protocol-upgrade
