name: Build and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tee /tmp/install.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "::error title=npm install failed::$(tail -20 /tmp/install.log | tr '\n' '|')"
            exit $exit_code
          fi

      - name: Check Node version
        run: |
          node --version && npm --version
          echo "--- node_modules/.bin (next must appear) ---"
          ls -la node_modules/.bin/ | grep -E 'next|tsc' || true
          echo "--- next binary ---"
          ls -la node_modules/next/dist/bin/next 2>&1 || true

      - name: Build project
        run: npm run build 2>&1
        env:
          SKIP_ENV_VALIDATION: true
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check build status
        run: |
          echo "Checking build output..."
          if [ -d .next ]; then
            echo "✓ Build successful"
            ls -la .next | head -20
          else
            echo "✗ Build failed - .next not found"
            echo "Contents of current directory:"
            ls -la
            exit 1
          fi

      - name: Build summary
        if: always()
        run: echo "Build workflow completed"
