name: Build and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Setup Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000 --ignore-engines

      - name: Check Node version
        run: |
          node --version && npm --version && yarn --version
          echo "--- node_modules/.bin (next must appear) ---"
          ls -la node_modules/.bin/ | grep -E 'next|tsc' || true
          echo "--- next binary ---"
          ls -la node_modules/next/dist/bin/next 2>&1 || true

      - name: Build project
        run: yarn build 2>&1
        env:
          SKIP_ENV_VALIDATION: true
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check build status
        run: |
          echo "Checking build output..."
          if [ -d .next ]; then
            echo "✓ Build successful"
            ls -la .next | head -20
          else
            echo "✗ Build failed - .next not found"
            echo "Contents of current directory:"
            ls -la
            exit 1
          fi

      - name: Build summary
        if: always()
        run: echo "Build workflow completed"
