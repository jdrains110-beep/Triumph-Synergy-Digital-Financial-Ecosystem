# ==========================================================================
# TRIUMPH SYNERGY DIGITAL FINANCIAL ECOSYSTEM
# ==========================================================================
# Docker Desktop deployment — runs ALONGSIDE Pi Network node
# Container prefix: triumph-*
#
# USAGE:
#   Mainnet:  docker compose up -d
#   Testnet:  docker compose --env-file .env.testnet up -d
#   Upgrade:  docker compose pull; docker compose up -d --build
#   Logs:     docker compose logs -f
#   Stop:     docker compose down
# ==========================================================================

name: triumph-synergy

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    org.pinetwork.project: "triumph-synergy"
    org.pinetwork.central-node: "GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V"

x-db-env: &db-env
  POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
  REDIS_URL: redis://triumph-redis:6379

x-pi-env: &pi-env
  PI_NETWORK_MODE: ${PI_NETWORK_MODE:-mainnet}
  # Active key resolves to mainnet or testnet depending on PI_NETWORK_MODE
  PI_API_KEY: ${PI_API_KEY:-lqss4cexoo16mfufdxertniodaaexh90gbwnx87tfzovd0h76nqgcqrv7owyf68k}
  PI_INTERNAL_API_KEY: ${PI_INTERNAL_API_KEY:-lqss4cexoo16mfufdxertniodaaexh90gbwnx87tfzovd0h76nqgcqrv7owyf68k}
  # Both keys embedded so network-aware services can select the right one at runtime
  PI_MAINNET_API_KEY: ${PI_MAINNET_API_KEY:-lqss4cexoo16mfufdxertniodaaexh90gbwnx87tfzovd0h76nqgcqrv7owyf68k}
  PI_TESTNET_API_KEY: ${PI_TESTNET_API_KEY:-h6fssskhcxjvl21r3qvxu6qnmnaan5mf6hzup0ay97xusxoflv7a1ayx3wxiohcr}
  PI_API_SECRET: ${PI_API_SECRET:-lqss4cexoo16mfufdxertniodaaexh90gbwnx87tfzovd0h76nqgcqrv7owyf68k}
  PI_API_URL: ${PI_API_URL:-https://api.minepi.com}
  NEXT_PUBLIC_PI_APP_ID: ${NEXT_PUBLIC_PI_APP_ID:-triumph-synergy}
  NEXT_PUBLIC_PI_SANDBOX: ${NEXT_PUBLIC_PI_SANDBOX:-false}
  PI_SUPERNODE_ADDRESS: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
  PI_SUPERNODE_MODE: "true"
  STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://api.mainnet.minepi.com}
  STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-Pi Network}
  CENTRAL_NODE_URL: http://triumph-central-node:11626
  CENTRAL_NODE_PUBLIC_KEY: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
  # Pi Node accessible via pi-bridge network (container name) and host
  PI_NODE_HOST: ${PI_NODE_CONTAINER:-testnet2}
  PI_NODE_PORT: ${PI_NODE_PORT:-31402}
  PI_NODE_API_PORT: ${PI_NODE_API_PORT:-8000}
  PI_NODE_PEER_PORT: ${PI_NODE_PEER_PORT:-31402}

services:
  # ========================================================================
  # INFRASTRUCTURE
  # ========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: triumph-postgres
    <<: *common
    mem_limit: 384m           # boosted — shared_buffers=64MB, work_mem=12MB, 150 connections
    mem_reservation: 192m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triumph_synergy}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triumph_secure_2026}
    # Internal only — no host port exposure
    expose:
      - "5432"
    volumes:
      - triumph_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-triumph_synergy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: triumph-redis
    <<: *common
    mem_limit: 192m           # boosted — io-threads=4, maxmemory=112mb, 2000 clients
    # Internal only — no host port exposure
    expose:
      - "6379"
    volumes:
      - triumph_redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - triumph-net
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================================================
  # PI BRIDGE CONNECTOR — Central Node ↔ Pi Node (testnet2) live link
  # Polls testnet2:8000 (Horizon) every 5s, publishes to Redis, routes txs
  # ========================================================================

  pi-bridge-connector:
    build:
      context: docker/pi-bridge-connector
    container_name: triumph-pi-bridge-connector
    <<: *common
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      <<: [*db-env, *pi-env]
      PORT: "8092"
      PI_NODE_HOST: ${PI_NODE_CONTAINER:-testnet2}
      PI_NODE_API_PORT: ${PI_NODE_API_PORT:-8000}
      PI_NODE_PEER_PORT: ${PI_NODE_PEER_PORT:-31402}
      POLL_INTERVAL_S: "5"
      CENTRAL_NODE_URL: http://triumph-central-node:11626
    expose:
      - "8092"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ========================================================================
  # PI CENTRAL NODE — Stellar Core Integration
  # ========================================================================

  central-node:
    build:
      context: .
      dockerfile: docker/central-node/Dockerfile
    container_name: triumph-central-node
    <<: *common
    mem_limit: 512m
    environment:
      <<: [*db-env, *pi-env]
      NODE_TYPE: central
      NODE_PRIORITY: supreme
      STELLAR_CORE_HTTP_PORT: 11626
      STELLAR_CORE_PEER_PORT: 11625
      PI_API_URL: ${PI_API_URL:-https://api.minepi.com}
      # KEY FIX: use local Pi node Horizon — same pi-bridge Docker network
      STELLAR_HORIZON_URL: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_INTERNAL_HORIZON_URL: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      SCP_AUTO_UPGRADE: "true"
      SCP_SYNC_INTERVAL_MS: 30000
      NODE_OPTIONS: "--max-old-space-size=384"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    # Internal only — no host port exposure
    expose:
      - "11625"
      - "11626"
    volumes:
      - triumph_central_data:/app/data
      - triumph_stellar_data:/opt/stellar/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pi-bridge-connector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11626/info"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # NEXT.JS APPLICATION — Main Ecosystem UI & API
  # ========================================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triumph-app
    <<: *common
    mem_limit: 768m
    ports:
      - "3000:3000"
    environment:
      <<: [*db-env, *pi-env]
      NODE_ENV: production
      DOCKER_BUILD: "true"
      AUTH_SECRET: ${AUTH_SECRET:-triumph-synergy-auth-secret-32chars-minimum-key}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-triumph-synergy-nextauth-secret-32chars-min}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000/api}
      INTERNAL_PI_MULTIPLIER: ${INTERNAL_PI_MULTIPLIER:-1.5}
      INTERNAL_PI_MIN_VALUE: ${INTERNAL_PI_MIN_VALUE:-10.0}
      EXTERNAL_PI_MIN_VALUE: ${EXTERNAL_PI_MIN_VALUE:-1.0}
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      central-node:
        condition: service_healthy
    networks:
      - triumph-net
      - pi-bridge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ========================================================================
  # PI TRANSACTION ENGINE — High-Throughput Processing
  # ========================================================================

  transaction-engine:
    build:
      context: .
      dockerfile: docker/transaction-engine/Dockerfile
    container_name: triumph-transaction-engine
    <<: *common
    mem_limit: 256m
    environment:
      <<: [*db-env, *pi-env]
      ENGINE_MODE: hyper
      NODE_OPTIONS: "--max-old-space-size=192"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    volumes:
      - triumph_tx_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      central-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # PI TRILLION VAULT — Secure Storage
  # ========================================================================

  vault:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile
    container_name: triumph-vault
    <<: *common
    mem_limit: 256m
    environment:
      <<: [*db-env, *pi-env]
      VAULT_MODE: trillion
      QUANTUM_ENCRYPTION: "true"
      NODE_OPTIONS: "--max-old-space-size=192"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    volumes:
      - triumph_vault_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      central-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # PI SMART CONTRACTS — Execution Engine
  # ========================================================================

  smart-contracts:
    build:
      context: .
      dockerfile: docker/smart-contracts/Dockerfile
    container_name: triumph-smart-contracts
    <<: *common
    mem_limit: 256m
    environment:
      <<: [*db-env, *pi-env]
      EXECUTION_CHANNELS: 10000
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      CENTRAL_NODE_URL: http://triumph-central-node:11626
      CONTRACTS_URL: http://triumph-smart-contracts:8082
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      NODE_OPTIONS: "--max-old-space-size=192"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    volumes:
      - triumph_contracts_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      central-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # PI SCP UPGRADER — Auto Protocol Sync
  # ========================================================================

  scp-upgrader:
    build:
      context: .
      dockerfile: docker/scp-upgrader/Dockerfile
    container_name: triumph-scp-upgrader
    <<: *common
    mem_limit: 128m
    environment:
      <<: [*db-env, *pi-env]
      AUTO_UPGRADE: "true"
      ZERO_DOWNTIME: "true"
      ROLLBACK_ON_FAILURE: "true"
      VERSION_CHECK_INTERVAL_MS: 60000
      PARAMETER_SYNC_INTERVAL_MS: 30000
      # KEY FIX: use local Pi node for SCP data instead of external internet
      PI_MAINNET_HORIZON: https://api.mainnet.minepi.com
      PI_TESTNET_HORIZON: https://api.testnet.minepi.com
      PI_LOCAL_HORIZON: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      NETWORK_TYPE: ${PI_NETWORK_MODE:-mainnet}
      NODE_OPTIONS: "--max-old-space-size=96"
    volumes:
      - triumph_scp_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      central-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # PI PAYMENT PROCESSOR — Queue-Based Payment Handling
  # ========================================================================

  payment-processor:
    build:
      context: ./services/payment-processor
      dockerfile: Dockerfile
    container_name: triumph-payment-processor
    <<: *common
    mem_limit: 256m
    environment:
      <<: [*db-env, *pi-env]
      WORKER_THREADS: 4
      NODE_OPTIONS: "--max-old-space-size=384"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # NGINX — Reverse Proxy & Load Balancer
  # ========================================================================

  nginx:
    image: nginx:alpine
    container_name: triumph-nginx
    <<: *common
    mem_limit: 128m          # doubled — handles 4096 worker_connections
    mem_reservation: 32m
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_started
      quantum-shield:
        condition: service_healthy
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========================================================================
  # MARKET DATA SERVICE — Live Pi Horizon data relay
  # ========================================================================

  market-data:
    build:
      context: .
      dockerfile: docker/market-data/Dockerfile
    container_name: triumph-market-data
    <<: *common
    mem_limit: 128m
    environment:
      <<: [*db-env, *pi-env]
      MARKET_POLL_MS: 5000
      # KEY FIX: market data reads live Pi ledger via bridge connector + Pi price from ML engine
      ML_ENGINE_URL: http://triumph-ml-engine:8090
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      STELLAR_HORIZON_URL: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      NODE_OPTIONS: "--max-old-space-size=96"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ========================================================================
  # BLOCKCHAIN ORACLE — Pi ledger event stream → Redis pub/sub
  # ========================================================================

  blockchain-oracle:
    build:
      context: .
      dockerfile: docker/blockchain-oracle/Dockerfile
    container_name: triumph-blockchain-oracle
    <<: *common
    mem_limit: 192m
    environment:
      <<: [*db-env, *pi-env]
      CONTRACTS_URL: http://triumph-smart-contracts:8082
      # KEY FIX: oracle reads live Pi ledger events via bridge connector
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      STELLAR_HORIZON_URL: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      NODE_OPTIONS: "--max-old-space-size=144"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      smart-contracts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # COMPLIANCE ENGINE — KYC / AML / GDPR / MiCA screening
  # ========================================================================

  compliance:
    build:
      context: .
      dockerfile: docker/compliance/Dockerfile
    container_name: triumph-compliance
    <<: *common
    mem_limit: 192m
    environment:
      <<: [*db-env, *pi-env]
      AML_THRESHOLD_PI: ${AML_THRESHOLD_PI:-10000}
      BLOCKED_ADDRESSES: ${BLOCKED_ADDRESSES:-}
      NODE_OPTIONS: "--max-old-space-size=144"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    networks:
      - triumph-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ========================================================================
  # DEX ENGINE — Pi token decentralized exchange
  # ========================================================================

  dex:
    build:
      context: .
      dockerfile: docker/dex/Dockerfile
    container_name: triumph-dex
    <<: *common
    mem_limit: 256m
    environment:
      <<: [*db-env, *pi-env]
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      NODE_OPTIONS: "--max-old-space-size=192"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    networks:
      - triumph-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s

  # ========================================================================
  # ML ENGINE — IsolationForest anomaly, GBM fraud, Ridge price, RSI sentiment
  # ========================================================================

  ml-engine:
    build:
      context: docker/ml-engine
    container_name: triumph-ml-engine
    <<: *common
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      <<: [*db-env, *pi-env]
      PORT: "8090"
      PYTHONUNBUFFERED: "1"
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
    expose:
      - "8090"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
      market-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ========================================================================
  # CREDIT ENGINE — PiCredit Score™ + Bureau Integration
  # Equifax | Experian | TransUnion | FICO | VantageScore
  # ========================================================================

  credit-engine:
    build:
      context: docker/credit-engine
    container_name: triumph-credit-engine
    <<: *common
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      <<: [*db-env, *pi-env]
      PORT: "8091"
      ML_ENGINE_URL: http://triumph-ml-engine:8090
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      QUANTUM_SHIELD_URL: http://triumph-quantum-shield:8094
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      CREDIT_SANDBOX: "true"
      # Wire live bureau keys in production:
      # BUREAU_API_KEY_EQUIFAX:    ${BUREAU_API_KEY_EQUIFAX}
      # BUREAU_API_KEY_EXPERIAN:   ${BUREAU_API_KEY_EXPERIAN}
      # BUREAU_API_KEY_TRANSUNION: ${BUREAU_API_KEY_TRANSUNION}
      # BUREAU_API_KEY_FICO:       ${BUREAU_API_KEY_FICO}
      # BUREAU_API_KEY_VANTAGE:    ${BUREAU_API_KEY_VANTAGE}
    expose:
      - "8091"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # QUANTUM SHIELD ENGINE — Post-quantum cryptographic resistance layer
  # NIST FIPS 203 (Kyber-1024) | FIPS 204 (Dilithium-5) | FIPS 205 (SPHINCS+)
  # Protects all 22 services against Shor + Grover quantum attacks
  # ========================================================================

  quantum-shield:
    build:
      context: docker/quantum-shield
    container_name: triumph-quantum-shield
    <<: *common
    mem_limit: 192m
    mem_reservation: 64m
    environment:
      PORT: "8094"
      REDIS_URL: redis://triumph-redis:6379
      # Canonical Pi dual-value constants
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      PI_SUPERNODE_ADDRESS: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
      # Service mesh URLs for full ecosystem audit
      APP_URL: http://triumph-nginx:80
      MARKET_DATA_URL: http://triumph-market-data:8085
      BLOCKCHAIN_ORACLE_URL: http://triumph-blockchain-oracle:8086
      COMPLIANCE_URL: http://triumph-compliance:8087
      DEX_URL: http://triumph-dex:8088
      TOKENIZATION_URL: http://triumph-tokenization-engine:8089
      ML_ENGINE_URL: http://triumph-ml-engine:8090
      CREDIT_ENGINE_URL: http://triumph-credit-engine:8091
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      CLOUD_MEMORY_URL: http://triumph-cloud-memory:8095
      TRANSACTION_URL: http://triumph-transaction-engine:8080
      PAYMENT_URL: http://triumph-payment-processor:8084
      VAULT_URL: http://triumph-vault:8081
      CONTRACTS_URL: http://triumph-smart-contracts:8082
      SCP_URL: http://triumph-scp-upgrader:8083
    expose:
      - "8094"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
      dual-value-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8094/health')"]
      interval: 20s
      timeout: 10s
      retries: 4
      start_period: 25s

  # ========================================================================
  # CLOUD MEMORY PLATFORM — LZ4 compressed, deduplicated, multi-platform store
  # 60-80% smaller payloads | content-addressed dedup | cross-service broadcast
  # Sustains 22+ platforms within one unified memory layer
  # ========================================================================

  cloud-memory:
    build:
      context: docker/cloud-memory
    container_name: triumph-cloud-memory
    <<: *common
    mem_limit: 128m
    mem_reservation: 48m
    environment:
      PORT: "8095"
      REDIS_URL: redis://triumph-redis:6379
      DEFAULT_TTL_S: "3600"
      HOT_TTL_S: "300"
      WARM_TTL_S: "3600"
      COLD_TTL_S: "86400"
      LZ4_LEVEL: "9"
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
    expose:
      - "8095"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')"]
      interval: 20s
      timeout: 10s
      retries: 4
      start_period: 25s

  # ========================================================================
  # DUAL-VALUE ENGINE — Pi Internal (mined) vs External (market) value
  # ========================================================================

  dual-value-engine:
    build:
      context: docker/dual-value-engine
    container_name: triumph-dual-value-engine
    <<: *common
    mem_limit: 256m
    mem_reservation: 96m
    environment:
      PORT: "8093"
      ML_ENGINE_URL: http://triumph-ml-engine:8090
      MARKET_DATA_URL: http://triumph-market-data:8085
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      CREDIT_ENGINE_URL: http://triumph-credit-engine:8091
      REDIS_URL: redis://triumph-redis:6379
      REFRESH_INTERVAL_S: "15"
      # CANONICAL Pi Dual-Value Constants — from lib/pios/pios-integration.ts
      PI_INTERNAL_RATE: "314159.0"       # $314,159/Pi — sovereign/mined (1000x)
      PI_EXTERNAL_RATE: "314.159"        # $314.159/Pi — market/traded
      PI_INTERNAL_MULTIPLIER: "1000.0"   # 1000x multiplier
      CLOUD_MEMORY_URL: http://triumph-cloud-memory:8095
      KYC_PREMIUM_PCT: "0.05"
      PIONEER_PREMIUM_PCT: "0.03"
    expose:
      - "8093"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
      market-data:
        condition: service_healthy
      pi-bridge-connector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/health')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # TOKENIZATION ENGINE — Pi domain + allodial deed tokenization
  # ========================================================================

  tokenization-engine:
    build:
      context: .
      dockerfile: docker/tokenization-engine/Dockerfile
    container_name: triumph-tokenization-engine
    <<: *common
    mem_limit: 256m
    environment:
      <<: [*db-env, *pi-env]
      NODE_OPTIONS: "--max-old-space-size=192"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
      TOKENIZATION_HMAC_KEY: ${TOKENIZATION_HMAC_KEY:-triumph-tokenization-fortress-2026}
      ML_ENGINE_URL: http://triumph-ml-engine:8090
      CREDIT_ENGINE_URL: http://triumph-credit-engine:8091
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
    expose:
      - "8089"
    networks:
      - triumph-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      credit-engine:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s

  # ========================================================================
  # PROMETHEUS — Metrics collection
  # ========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: triumph-prometheus
    <<: *common
    mem_limit: 256m
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - triumph_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ========================================================================
  # GRAFANA — Metrics dashboards
  # ========================================================================

  # ========================================================================
  # POSTGRES EXPORTER — exposes pg metrics for Prometheus
  # ========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: triumph-postgres-exporter
    <<: *common
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-triumph_secure_2026}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}?sslmode=disable"
    expose:
      - "9187"
    networks:
      - triumph-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ========================================================================
  # REDIS EXPORTER — exposes redis metrics for Prometheus
  # ========================================================================
  redis-exporter:
    image: oliver006/redis_exporter:alpine
    container_name: triumph-redis-exporter
    <<: *common
    mem_limit: 32m
    environment:
      REDIS_ADDR: "redis://triumph-redis:6379"
    expose:
      - "9121"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9121/metrics"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ========================================================================
  # HORIZON GUARDIAN — keeps testnet2 Horizon process alive for Pi bridge
  # ========================================================================
  horizon-guardian:
    build:
      context: docker/horizon-guardian
    container_name: triumph-horizon-guardian
    <<: *common
    mem_limit: 64m
    mem_reservation: 16m
    environment:
      TARGET_CONTAINER: testnet2
      TARGET_PROCESS: horizon
      TARGET_URL: http://localhost:8000/
      GUARD_INTERVAL_S: "20"
      METRICS_PORT: "9911"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "9911"
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /var/run/docker.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: triumph-grafana
    <<: *common
    mem_limit: 256m
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-triumph_grafana_2026}
      GF_SERVER_ROOT_URL:         "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - triumph_grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

# ==========================================================================
# VOLUMES — Persistent Data
# ==========================================================================

volumes:
  triumph_tokenization_data:
    name: triumph_tokenization_data
  triumph_pg_data:
    name: triumph_pg_data
  triumph_redis_data:
    name: triumph_redis_data
  triumph_central_data:
    name: triumph_central_data
  triumph_stellar_data:
    name: triumph_stellar_data
  triumph_tx_data:
    name: triumph_tx_data
  triumph_vault_data:
    name: triumph_vault_data
  triumph_contracts_data:
    name: triumph_contracts_data
  triumph_scp_data:
    name: triumph_scp_data
  triumph_prometheus_data:
    name: triumph_prometheus_data
  triumph_grafana_data:
    name: triumph_grafana_data

# ==========================================================================
# NETWORK — Shared with Pi Network node for direct communication
# ==========================================================================
#
# After starting:  docker network connect pi-bridge testnet2
# This connects the Pi Node container to the ecosystem so central-node
# can communicate with it directly.
# ==========================================================================

networks:
  triumph-net:
    name: triumph-net
    driver: bridge
  pi-bridge:
    name: pi-bridge
    driver: bridge
