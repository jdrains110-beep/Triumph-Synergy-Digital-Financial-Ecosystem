  # HORIZON-STREAM — Super-Pod
  # blockchain-oracle + market-data
  # ========================================================================

  horizon-stream:
    build:
      context: .
      dockerfile: docker/horizon-stream/Dockerfile
    container_name: triumph-horizon-stream
    <<: *common
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.30
    environment:
      <<: [*db-env, *pi-env]
      MARKET_POLL_MS: 5000
      ORACLE_POLL_MS: 5000
    volumes:
      - triumph_stellar_data:/app/data
    expose:
      - "8085"
      - "8086"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
      pi-bridge-connector:
        condition: service_healthy

  # ========================================================================
  # OBSERVABILITY-STACK — Super-Pod
  # prometheus + grafana + postgres-exporter + redis-exporter
  # ========================================================================

  observability-stack:
    build:
      context: docker
      dockerfile: observability-stack/Dockerfile
    container_name: triumph-observability-stack
    <<: *common
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 0.40
    ports:
      - "3001:3000"
      - "9090:9090"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}?sslmode=disable"
      REDIS_ADDR: "redis://triumph-redis:6379"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-triumph_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - triumph_prometheus_data:/prometheus
      - triumph_grafana_data:/var/lib/grafana
      - triumph_cloud_memory_backup:/backup
    expose:
      - "9121"
      - "9187"
      - "8095"
    networks:
      - triumph-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========================================================================
  # ECOSYSTEM-GUARDIAN — Watchdog Super-Pod
  # Health-Governor (9912) + Network-Sentinel (9913) + Horizon-Guardian (9911)
  # supervisord manages all three watchdogs with independent restart policies
  # ========================================================================

  ecosystem-guardian:
    build:
      context: docker/ecosystem-guardian
    container_name: triumph-ecosystem-guardian
    <<: *common
    restart: on-failure:10
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 0.20
    environment:
      GOVERNOR_INTERVAL_S: "30"
      MEMORY_WARN_PCT: "80"
      MEMORY_KILL_PCT: "101"
      METRICS_PORT: "9912"
      CONTAINER_PREFIX: "triumph-"
      PROTECTED_CONTAINERS: "triumph-postgres,triumph-redis,triumph-vault"
      HEALTH_FAIL_THRESHOLD: "3"
      DOCKER_UNHEALTHY_THRESHOLD: "3"
      RESTART_BACKOFF_BASE_S: "60"
      RESTART_BACKOFF_MAX_S: "600"
      HEALTH_PROBE_TIMEOUT_S: "10"
      ML_SELF_HEAL_ENABLED: "true"
      ML_HISTORY_WINDOW_S: "900"
      ML_MAX_RESTARTS_PER_WINDOW: "4"
      ML_SUPPRESSION_S: "300"
      CONTROL_PLANE_REQUIRE_PQ_READY: "true"
      QUANTUM_SHIELD_URL: "http://triumph-quantum-fortress:8094"
      SAIB_URL: "http://triumph-sovereign-fortress:8099"
      PQ_CHECK_INTERVAL_S: "30"
      PROBE_INTERVAL_S: "15"
      SENTINEL_METRICS_PORT: "9913"
      REDIS_URL: "redis://triumph-redis:6379"
      PI_NODE_HOST: "testnet2"
      PI_NODE_PEER_PORT: "31402"
      PI_HORIZON_URL: "http://testnet2:8000"
      PI_BRIDGE_URL: "http://triumph-pi-bridge-connector:8092"
      ML_ENGINE_URL: "http://triumph-financial-intel:8090"
      SELF_HEAL_ML_ENABLED: "true"
      ANOMALY_Z_THRESHOLD: "2.5"
      ANOMALY_STREAK_THRESHOLD: "3"
      TARGET_CONTAINER: testnet2
      TARGET_PROCESS: horizon
      TARGET_URL: http://localhost:8000/
      GUARD_INTERVAL_S: "20"
      GUARDIAN_METRICS_PORT: "9911"
      PI_BRIDGE_NETWORK: pi-bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "9911"
      - "9912"
      - "9913"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9912/health', timeout=8)"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 20s

  # ========================================================================
  # APEX-SOVEREIGN-LIFE — Super-Pod (3 services → 1 container)
  # ========================================================================
  # Consolidates the three apex sovereign single-process services that share
  # an identical FastAPI/uvicorn/Redis stack and the same upstream deps:
  #   sovereign-bank      (8150) — full-reserve, 0%, anti-cartel Pi bank
  #   sovereign-education (8130) — K-12, college, faculty pay, learn-and-earn
  #   sovereign-telecom   (8140) — 7-layer quantum mesh, never-offline
  # supervisord co-locates all three for in-pod localhost calls and removes
  # 2 redundant container overheads (~256 MB RAM each → 1 shared 512 MB pod).
  # ========================================================================

  sovereign-life:
    build:
      context: docker
      dockerfile: sovereign-life/Dockerfile
    container_name: triumph-sovereign-life
    <<: *common
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.50
    environment:
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      # Each service uses its own Redis DB index (preserved from standalone)
      BANK_REDIS_URL: redis://triumph-redis:6379/9
      EDUCATION_REDIS_URL: redis://triumph-redis:6379/7
      TELECOM_REDIS_URL: redis://triumph-redis:6379/8
      REDIS_URL: redis://triumph-redis:6379
      VAULT_URL: http://triumph-vault:8081
      # Payment processor now lives inside settlement-core super-pod on 8084
      PAYMENT_URL: http://triumph-settlement-core:8084
      SAIB_URL: http://triumph-sovereign-fortress:8099
      QUANTUM_SHIELD_URL: http://triumph-quantum-fortress:8094
    expose:
      - "8130"
      - "8140"
      - "8150"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; [ (lambda p: (lambda s: (s.settimeout(5), s.connect(('127.0.0.1', p)), s.close()))(socket.socket()))(p) for p in (8130, 8140, 8150) ]"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 120s

# ==========================================================================
# VOLUMES — Persistent Data
# ==========================================================================

volumes:
  triumph_tokenization_data:
    name: triumph_tokenization_data
  triumph_pg_data:
    name: triumph_pg_data
  triumph_redis_data:
    name: triumph_redis_data
  triumph_central_data:
    name: triumph_central_data
  triumph_stellar_data:
    name: triumph_stellar_data
  triumph_tx_data:
    name: triumph_tx_data
  triumph_vault_data:
    name: triumph_vault_data
  triumph_contracts_data:
    name: triumph_contracts_data
  triumph_scp_data:
    name: triumph_scp_data
  triumph_prometheus_data:
    name: triumph_prometheus_data
  triumph_grafana_data:
    name: triumph_grafana_data
  triumph_cloud_memory_backup:
    name: triumph_cloud_memory_backup

# ==========================================================================
# NETWORK — Shared with Pi Network node for direct communication
# ==========================================================================
#
# After starting:  docker network connect pi-bridge testnet2
# This connects the Pi Node container to the ecosystem so central-node
# can communicate with it directly.
# ==========================================================================

networks:
  triumph-net:
    name: triumph-net
    driver: bridge
  pi-bridge:
    name: pi-bridge
    driver: bridge
