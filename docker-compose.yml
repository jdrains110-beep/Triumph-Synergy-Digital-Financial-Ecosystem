# ==========================================================================
# TRIUMPH SYNERGY DIGITAL FINANCIAL ECOSYSTEM — APEX SUPER-SOVEREIGN STACK
# ==========================================================================
# 33 services consolidated into 7 Super-Sovereign Pods + 8 standalone = 15 containers
#
#   1. sovereign-fortress    (5→1) ai-bot+gateway+delivery+pidex+sports
#   2. quantum-fortress      (2→1) quantum-shield+qpu-bridge  [ML-KEM-1024+ML-DSA-87+SPHINCS+]
#   3. horizon-stream        (2→1) blockchain-oracle+market-data
#   4. financial-intel       (3→1) credit-engine+ml-engine+dual-value-engine
#   5. observability-stack   (4→1) prometheus+grafana+postgres-exporter+redis-exporter
#   6. settlement-core       (4→1) transaction+smart-contracts+tokenization+dex
#   7. governance-shield     (4→1) compliance+judicial-monitor+central-node+scp-upgrader
#
# Standalone (8): app, postgres, redis, vault, pi-bridge-connector, nginx,
#                 cloud-memory, ecosystem-guardian, payment-processor
# ==========================================================================

name: triumph-synergy

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
  memswap_limit: 0
  oom_kill_disable: false
  labels:
    org.pinetwork.project: "triumph-synergy"
    org.pinetwork.central-node: "GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V"
    org.triumph.blockchain.powered-by: "Pi Network"
    org.triumph.consensus.protocol: "Stellar SCP"
    org.triumph.ecosystem.class: "sovereign-quantum-financial"
    org.triumph.architecture: "apex-super-sovereign-pods"
    org.triumph.pq.suite: "ML-KEM-1024+ML-DSA-87+SPHINCS+"

x-db-env: &db-env
  POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
  REDIS_URL: redis://triumph-redis:6379
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://your-project.supabase.co}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-anon-key}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
  SUPABASE_DB_URL: ${SUPABASE_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}}

x-pi-env: &pi-env
  PI_NETWORK_MODE: ${PI_NETWORK_MODE:-mainnet}
  PI_API_KEY: ${PI_API_KEY:?PI_API_KEY required}
  PI_INTERNAL_API_KEY: ${PI_INTERNAL_API_KEY:?PI_INTERNAL_API_KEY required}
  PI_MAINNET_API_KEY: ${PI_MAINNET_API_KEY:?PI_MAINNET_API_KEY required}
  PI_TESTNET_API_KEY: ${PI_TESTNET_API_KEY:?PI_TESTNET_API_KEY required}
  PI_API_SECRET: ${PI_API_SECRET:?PI_API_SECRET required}
  PI_API_URL: ${PI_API_URL:-https://api.minepi.com}
  NEXT_PUBLIC_PI_APP_ID: ${NEXT_PUBLIC_PI_APP_ID:-triumph-synergy}
  NEXT_PUBLIC_PI_SANDBOX: ${NEXT_PUBLIC_PI_SANDBOX:-false}
  PI_SUPERNODE_ADDRESS: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
  PI_SUPERNODE_MODE: "true"
  STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://api.mainnet.minepi.com}
  STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-Pi Network}
  CENTRAL_NODE_URL: http://triumph-governance-shield:11626
  CENTRAL_NODE_PUBLIC_KEY: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
  PI_NODE_HOST: ${PI_NODE_CONTAINER:-testnet2}
  PI_NODE_PORT: ${PI_NODE_PORT:-31402}
  PI_NODE_API_PORT: ${PI_NODE_API_PORT:-8000}
  PI_NODE_PEER_PORT: ${PI_NODE_PEER_PORT:-31402}
  # Super-pod URLs (DNS-resolved internally)
  QUANTUM_SHIELD_URL: http://triumph-quantum-fortress:8094
  QPU_BRIDGE_URL: http://triumph-quantum-fortress:8098
  SAIB_URL: http://triumph-sovereign-fortress:8099
  SOVEREIGN_GATEWAY_URL: http://triumph-sovereign-fortress:8097
  SOVEREIGN_DELIVERY_URL: http://triumph-sovereign-fortress:8100
  SOVEREIGN_PIDEX_URL: http://triumph-sovereign-fortress:8101
  SOVEREIGN_SPORTS_URL: http://triumph-sovereign-fortress:8102
  DUAL_VALUE_URL: http://triumph-financial-intel:8093
  CREDIT_ENGINE_URL: http://triumph-financial-intel:8091
  ML_ENGINE_URL: http://triumph-financial-intel:8090
  TRANSACTION_ENGINE_URL: http://triumph-settlement-core:8080
  SMART_CONTRACTS_URL: http://triumph-settlement-core:8082
  TOKENIZATION_URL: http://triumph-settlement-core:8089
  DEX_URL: http://triumph-settlement-core:8088
  COMPLIANCE_URL: http://triumph-governance-shield:8087
  JUDICIAL_URL: http://triumph-governance-shield:8096
  SCP_UPGRADER_URL: http://triumph-governance-shield:8083
  BLOCKCHAIN_ORACLE_URL: http://triumph-horizon-stream:8086
  MARKET_DATA_URL: http://triumph-horizon-stream:8085
  PROMETHEUS_URL: http://triumph-observability-stack:9090
  GRAFANA_URL: http://triumph-observability-stack:3000
  PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092

services:
  # ========================================================================
  # STATEFUL CORE — postgres, redis, vault (preserved volumes)
  # ========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: triumph-postgres
    <<: *common
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.40
    oom_score_adj: -500
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triumph_synergy}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    expose:
      - "5432"
    volumes:
      - triumph_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-triumph_synergy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: triumph-redis
    <<: *common
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.20
    oom_score_adj: -500
    expose:
      - "6379"
    volumes:
      - triumph_redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - triumph-net
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vault:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile
    container_name: triumph-vault
    <<: *common
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.15
    environment:
      <<: [*db-env, *pi-env]
      VAULT_MODE: trillion
      QUANTUM_ENCRYPTION: "true"
      VAULT_REQUIRE_PQ_SIGNATURE: "true"
      NODE_OPTIONS: "--max-old-space-size=128"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    volumes:
      - triumph_vault_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 90s

  # ========================================================================
  # PI BRIDGE CONNECTOR — Live link to Pi Node testnet2 (must remain alone)
  # ========================================================================

  pi-bridge-connector:
    build:
      context: docker/pi-bridge-connector
    container_name: triumph-pi-bridge-connector
    <<: *common
    restart: on-failure:10
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.20
    environment:
      <<: [*db-env, *pi-env]
      PORT: "8092"
      PI_NODE_API_PORT: 8000
      PI_NODE_FALLBACK_URL: http://host.docker.internal:31401
      PI_NODE_PUBLIC_FALLBACK_URL: https://api.testnet.minepi.com
      PI_POLL_RETRIES: "4"
      PI_POLL_RETRY_DELAY_S: "1.5"
      POLL_INTERVAL_S: "6"
      SOVEREIGN_PQ_ENFORCE: "true"
      STELLAR_CORE_VERSION_OVERRIDE: "5.4"
      PI_NODE_VERSION_DISPLAY: "5.4"
    expose:
      - "8092"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(8); s.connect(('127.0.0.1',8092)); s.close()"]
      interval: 15s
      timeout: 12s
      retries: 8
      start_period: 60s

  # ========================================================================
  # SUPER-POD 7: GOVERNANCE-SHIELD
  # compliance + judicial-monitor + central-node + scp-upgrader
  # ========================================================================

  governance-shield:
    build:
      context: .
      dockerfile: docker/governance-shield/Dockerfile
    container_name: triumph-governance-shield
    <<: *common
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 0.50
    environment:
      <<: [*db-env, *pi-env]
      NODE_TYPE: central
      NODE_PRIORITY: supreme
      STELLAR_CORE_HTTP_PORT: 11626
      AUTO_UPGRADE: "true"
      ZERO_DOWNTIME: "true"
      ROLLBACK_ON_FAILURE: "true"
      VERSION_CHECK_INTERVAL_MS: 60000
      PARAMETER_SYNC_INTERVAL_MS: 30000
      PI_MAINNET_HORIZON: https://api.mainnet.minepi.com
      PI_TESTNET_HORIZON: https://api.testnet.minepi.com
      PI_LOCAL_HORIZON: http://${PI_NODE_CONTAINER:-testnet2}:${PI_NODE_API_PORT:-8000}
      NETWORK_TYPE: ${PI_NETWORK_MODE:-mainnet}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
      COMPLIANCE_REQUIRE_PQ: "true"
      JUDICIAL_REQUIRE_PQ: "true"
      SCP_REQUIRE_PQ_SIGNATURE: "true"
    volumes:
      - triumph_central_data:/app/data/central
      - triumph_scp_data:/app/data/scp
    expose:
      - "8083"
      - "8087"
      - "8096"
      - "11625"
      - "11626"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pi-bridge-connector:
        condition: service_healthy

  # ========================================================================
  # NEXT.JS APPLICATION — Main Ecosystem UI & API (kept standalone)
  # ========================================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triumph-app
    <<: *common
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.40
    ports:
      - "3000:3000"
    environment:
      <<: [*db-env, *pi-env]
      NODE_ENV: production
      DOCKER_BUILD: "true"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000/api}
      INTERNAL_PI_MULTIPLIER: ${INTERNAL_PI_MULTIPLIER:-1.5}
      INTERNAL_PI_MIN_VALUE: ${INTERNAL_PI_MIN_VALUE:-10.0}
      EXTERNAL_PI_MIN_VALUE: ${EXTERNAL_PI_MIN_VALUE:-1.0}
      APP_REQUIRE_PQ_SIGNATURE: "true"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      governance-shield:
        condition: service_started
    networks:
      - triumph-net
      - pi-bridge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 120s

  # ========================================================================
  # SUPER-POD 6: SETTLEMENT-CORE
  # transaction-engine + smart-contracts + tokenization-engine + dex
  # ========================================================================

  settlement-core:
    build:
      context: .
      dockerfile: docker/settlement-core/Dockerfile
    container_name: triumph-settlement-core
    <<: *common
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 0.50
    environment:
      <<: [*db-env, *pi-env]
      ENGINE_MODE: hyper
      NODE_OPTIONS: "--max-old-space-size=512"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
      EXECUTION_CHANNELS: 10000
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      TRANSACTION_REQUIRE_PQ_SIGNATURE: "true"
      SMART_CONTRACTS_REQUIRE_PQ_SIGNATURE: "true"
      TOKENIZATION_REQUIRE_PQ_SIGNATURE: "true"
      DEX_REQUIRE_PQ_SIGNATURE: "true"
    volumes:
      - triumph_tx_data:/app/data/tx
      - triumph_contracts_data:/app/data/contracts
      - triumph_tokenization_data:/app/data/tokens
    expose:
      - "8080"
      - "8082"
      - "8088"
      - "8089"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      governance-shield:
        condition: service_started

  # ========================================================================
  # SUPER-POD 4: FINANCIAL-INTEL
  # credit-engine + ml-engine + dual-value-engine
  # ========================================================================

  financial-intel:
    build:
      context: docker
      dockerfile: financial-intel/Dockerfile
    container_name: triumph-financial-intel
    <<: *common
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 0.60
    environment:
      <<: [*db-env, *pi-env]
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
    expose:
      - "8090"
      - "8091"
      - "8093"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy

  # ========================================================================
  # SUPER-POD 2: QUANTUM-FORTRESS
  # quantum-shield + qpu-bridge — ML-KEM-1024 + ML-DSA-87 + SPHINCS+
  # ========================================================================

  quantum-fortress:
    build:
      context: docker
      dockerfile: quantum-fortress/Dockerfile
    container_name: triumph-quantum-fortress
    <<: *common
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.30
    environment:
      <<: [*db-env, *pi-env]
      PORT: "8094"
      QPU_PORT: "8098"
    expose:
      - "8094"
      - "8098"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy

  # ========================================================================
  # SUPER-POD 1: SOVEREIGN-FORTRESS
  # ai-bot + gateway + delivery + pidex + sports-hub
  # ========================================================================

  sovereign-fortress:
    build:
      context: docker
      dockerfile: sovereign-fortress/Dockerfile
    container_name: triumph-sovereign-fortress
    <<: *common
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 0.60
    environment:
      <<: [*db-env, *pi-env]
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      AI_BOT_REQUIRE_PQ: "true"
      GATEWAY_REQUIRE_PQ: "true"
    expose:
      - "8097"
      - "8099"
      - "8100"
      - "8101"
      - "8102"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
      quantum-fortress:
        condition: service_started

  # ========================================================================
  # SUPER-POD 3: HORIZON-STREAM
  # blockchain-oracle + market-data
  # ========================================================================

  horizon-stream:
    build:
      context: .
      dockerfile: docker/horizon-stream/Dockerfile
    container_name: triumph-horizon-stream
    <<: *common
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.30
    environment:
      <<: [*db-env, *pi-env]
      MARKET_POLL_MS: 5000
      ORACLE_POLL_MS: 5000
    volumes:
      - triumph_stellar_data:/app/data
    expose:
      - "8085"
      - "8086"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
      pi-bridge-connector:
        condition: service_healthy

  # ========================================================================
  # PAYMENT PROCESSOR — kept standalone (uses ./services/payment-processor)
  # ========================================================================

  payment-processor:
    build:
      context: ./services/payment-processor
      dockerfile: Dockerfile
    container_name: triumph-payment-processor
    <<: *common
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.15
    environment:
      <<: [*db-env, *pi-env]
      WORKER_THREADS: 2
      NODE_OPTIONS: "--max-old-space-size=128"
      PAYMENT_REQUIRE_PQ_SIGNATURE: "true"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      settlement-core:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/health"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 90s

  # ========================================================================
  # CLOUD MEMORY — kept standalone (long backups, distinct lifecycle)
  # ========================================================================

  cloud-memory:
    build:
      context: docker/cloud-memory
    container_name: triumph-cloud-memory
    <<: *common
    mem_limit: 384m
    mem_reservation: 128m
    cpus: 0.15
    user: "1000:1000"
    environment:
      PORT: "8095"
      REDIS_URL: redis://triumph-redis:6379
      DEFAULT_TTL_S: "3600"
      HOT_TTL_S: "300"
      WARM_TTL_S: "3600"
      COLD_TTL_S: "86400"
      LZ4_LEVEL: "9"
      AUTO_SYNC_ENABLED: ${CLOUD_MEMORY_AUTO_SYNC_ENABLED:-true}
      BACKUP_SCHEDULE_S: ${CLOUD_MEMORY_BACKUP_SCHEDULE_S:-900}
      BACKUP_LOCAL_DIR: /backup/local
      BACKUP_OFFLINE_DIR: /backup/offline
      CLOUD_MEMORY_S3_ENABLED: ${CLOUD_MEMORY_S3_ENABLED:-false}
      CLOUD_MEMORY_S3_BUCKET: ${CLOUD_MEMORY_S3_BUCKET:-}
      CLOUD_MEMORY_S3_PREFIX: ${CLOUD_MEMORY_S3_PREFIX:-triumph-cloud-memory}
      CLOUD_MEMORY_S3_REGION: ${CLOUD_MEMORY_S3_REGION:-us-east-1}
      CLOUD_MEMORY_S3_ENDPOINT: ${CLOUD_MEMORY_S3_ENDPOINT:-}
      CLOUD_MEMORY_S3_ACCESS_KEY_ID: ${CLOUD_MEMORY_S3_ACCESS_KEY_ID:-}
      CLOUD_MEMORY_S3_SECRET_ACCESS_KEY: ${CLOUD_MEMORY_S3_SECRET_ACCESS_KEY:-}
      APPLE_CLOUD_WEBDAV_ENABLED: ${APPLE_CLOUD_WEBDAV_ENABLED:-false}
      APPLE_CLOUD_WEBDAV_BASE_URL: ${APPLE_CLOUD_WEBDAV_BASE_URL:-}
      APPLE_CLOUD_WEBDAV_USERNAME: ${APPLE_CLOUD_WEBDAV_USERNAME:-}
      APPLE_CLOUD_WEBDAV_PASSWORD: ${APPLE_CLOUD_WEBDAV_PASSWORD:-}
      APPLE_CLOUD_WEBDAV_PATH: ${APPLE_CLOUD_WEBDAV_PATH:-/triumph-cloud-memory}
      SYNC_HTTP_TIMEOUT_S: ${CLOUD_MEMORY_SYNC_HTTP_TIMEOUT_S:-20}
      QUANTUM_SHIELD_URL: http://triumph-quantum-fortress:8094
      SAIB_URL: http://triumph-sovereign-fortress:8099
      CLOUD_MEMORY_REQUIRE_PQ: "true"
    volumes:
      - triumph_cloud_memory_backup:/backup
    expose:
      - "8095"
    networks:
      - triumph-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=20)"]
      interval: 30s
      timeout: 25s
      retries: 5
      start_period: 180s

  # ========================================================================
  # SUPER-POD 5: OBSERVABILITY-STACK
  # prometheus + grafana + postgres-exporter + redis-exporter
  # ========================================================================

  observability-stack:
    build:
      context: docker
      dockerfile: observability-stack/Dockerfile
    container_name: triumph-observability-stack
    <<: *common
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 0.40
    ports:
      - "3001:3000"     # Grafana
      - "9090:9090"     # Prometheus
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}?sslmode=disable"
      REDIS_ADDR: "redis://triumph-redis:6379"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-triumph_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - triumph_prometheus_data:/prometheus
      - triumph_grafana_data:/var/lib/grafana
    expose:
      - "9121"   # redis-exporter
      - "9187"   # postgres-exporter
    networks:
      - triumph-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ========================================================================
  # SUPER-POD 8: SOVEREIGN-INSURANCE
  # life + home + health + auto + dental + vision + hospital
  # ========================================================================

  sovereign-insurance:
    build:
      context: docker
      dockerfile: sovereign-insurance/Dockerfile
    container_name: triumph-sovereign-insurance
    <<: *common
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 0.40
    environment:
      <<: [*db-env, *pi-env]
      QUANTUM_FORTRESS_URL: http://triumph-quantum-fortress:8094
    expose:
      - "8110"
      - "8111"
      - "8112"
      - "8113"
      - "8114"
      - "8115"
      - "8116"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
      quantum-fortress:
        condition: service_started

  # ========================================================================
  # SUPER-POD 9: SOVEREIGN-UTILITIES
  # electric + water + gas + hoa + plumbing + hvac
  # ========================================================================

  sovereign-utilities:
    build:
      context: docker
      dockerfile: sovereign-utilities/Dockerfile
    container_name: triumph-sovereign-utilities
    <<: *common
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 0.40
    environment:
      <<: [*db-env, *pi-env]
      PAYMENT_PROCESSOR_URL: http://triumph-payment-processor:8084
    expose:
      - "8120"
      - "8121"
      - "8122"
      - "8123"
      - "8124"
      - "8125"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
      payment-processor:
        condition: service_started

  # ========================================================================
  # NGINX — Reverse Proxy (kept standalone, slim alpine image)
  # ========================================================================

  nginx:
    image: nginx:alpine
    container_name: triumph-nginx
    <<: *common
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/nginx/server-cert.pem:/etc/nginx/certs/server-cert.pem:ro
      - ./certs/nginx/server-key.pem:/etc/nginx/certs/server-key.pem:ro
    depends_on:
      app:
        condition: service_started
      quantum-fortress:
        condition: service_started
    networks:
      - triumph-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ========================================================================
  # ECOSYSTEM-GUARDIAN — Watchdog super-pod (already 3→1 merged)
  # Health-Governor + Network-Sentinel + Horizon-Guardian via supervisord
  # ========================================================================

  ecosystem-guardian:
    build:
      context: docker/ecosystem-guardian
    container_name: triumph-ecosystem-guardian
    <<: *common
    restart: on-failure:10
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 0.20
    environment:
      GOVERNOR_INTERVAL_S: "30"
      MEMORY_WARN_PCT: "80"
      MEMORY_KILL_PCT: "101"
      METRICS_PORT: "9912"
      CONTAINER_PREFIX: "triumph-"
      PROTECTED_CONTAINERS: "triumph-postgres,triumph-redis,triumph-vault"
      HEALTH_FAIL_THRESHOLD: "3"
      DOCKER_UNHEALTHY_THRESHOLD: "3"
      RESTART_BACKOFF_BASE_S: "60"
      RESTART_BACKOFF_MAX_S: "600"
      HEALTH_PROBE_TIMEOUT_S: "10"
      ML_SELF_HEAL_ENABLED: "true"
      ML_HISTORY_WINDOW_S: "900"
      ML_MAX_RESTARTS_PER_WINDOW: "4"
      ML_SUPPRESSION_S: "300"
      CONTROL_PLANE_REQUIRE_PQ_READY: "true"
      QUANTUM_SHIELD_URL: "http://triumph-quantum-fortress:8094"
      SAIB_URL: "http://triumph-sovereign-fortress:8099"
      PQ_CHECK_INTERVAL_S: "30"
      PROBE_INTERVAL_S: "15"
      SENTINEL_METRICS_PORT: "9913"
      REDIS_URL: "redis://triumph-redis:6379"
      PI_NODE_HOST: "testnet2"
      PI_NODE_PEER_PORT: "31402"
      PI_HORIZON_URL: "http://testnet2:8000"
      PI_BRIDGE_URL: "http://triumph-pi-bridge-connector:8092"
      ML_ENGINE_URL: "http://triumph-financial-intel:8090"
      SELF_HEAL_ML_ENABLED: "true"
      ANOMALY_Z_THRESHOLD: "2.5"
      ANOMALY_STREAK_THRESHOLD: "3"
      TARGET_CONTAINER: testnet2
      TARGET_PROCESS: horizon
      TARGET_URL: http://localhost:8000/
      GUARD_INTERVAL_S: "20"
      GUARDIAN_METRICS_PORT: "9911"
      PI_BRIDGE_NETWORK: pi-bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "9911"
      - "9912"
      - "9913"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy

# ==========================================================================
# VOLUMES — preserved across teardown
# ==========================================================================
volumes:
  triumph_pg_data:
    name: triumph_pg_data
  triumph_redis_data:
    name: triumph_redis_data
  triumph_vault_data:
    name: triumph_vault_data
  triumph_central_data:
    name: triumph_central_data
  triumph_stellar_data:
    name: triumph_stellar_data
  triumph_tx_data:
    name: triumph_tx_data
  triumph_contracts_data:
    name: triumph_contracts_data
  triumph_tokenization_data:
    name: triumph_tokenization_data
  triumph_scp_data:
    name: triumph_scp_data
  triumph_prometheus_data:
    name: triumph_prometheus_data
  triumph_grafana_data:
    name: triumph_grafana_data
  triumph_cloud_memory_backup:
    name: triumph_cloud_memory_backup

# ==========================================================================
# NETWORKS
# ==========================================================================
networks:
  triumph-net:
    name: triumph-net
    driver: bridge
  pi-bridge:
    name: pi-bridge
    driver: bridge
