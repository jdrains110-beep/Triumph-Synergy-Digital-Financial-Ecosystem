# ==========================================================================
# TRIUMPH SYNERGY DIGITAL FINANCIAL ECOSYSTEM
# ==========================================================================
# Docker Desktop deployment — runs ALONGSIDE Pi Network node
# Container prefix: triumph-*
#
# USAGE:
#   Mainnet:  docker compose up -d
#   Upgrade:  docker compose pull; docker compose up -d --build
#   Logs:     docker compose logs -f
#   Stop:     docker compose down
#
# QUANTUM-MANAGED RESOURCE TIERING
# --------------------------------------------------------------------------
# mem_limit       = HARD ceiling (~2x typical RSS, prevents runaway leaks)
# mem_reservation = SOFT floor (~ idle RSS, hint to Docker scheduler)
# cpus            = weighted share, NOT a hard core count; sum may exceed
#                   host cores — Docker time-slices fairly under contention.
#
# Tiers (RSS-class):
#   T0  Stellar core      pi-mainnet-node                   (4500m / 1.5 cpu)
#   T1  Datastore         postgres, redis                   (256m / 0.5 cpu)
#   T2  Mega-pod          apex-services (18 svcs)           (1536m / 1.0 cpu)
#   T3  Sentinel nexus    apex-sovereign-nexus, observ.     (768m / 0.6 cpu)
#   T4  Quorum/settle     governance-shield, settlement,    (384m / 0.4 cpu)
#                         supernode-peer-2, quantum-intel
#   T5  Mesh peer         sovereign-* / horizon / app /     (256m / 0.3 cpu)
#                         pi-bridge-connector / military
#   T6  Sidekick          vault, nginx, guardian-watchdog,  (128m / 0.2 cpu)
#                         sovereign-mesh-hub
#
# Total ceiling: ~11 GB (over-subscribed); typical idle RSS: ~4-5 GB.
# Brings full apex-sentinel-nexus mesh online inside 6.21 GB Docker Desktop.
# ==========================================================================

name: triumph-synergy

x-common:
  # restart: always — survives Docker Desktop restarts (unlike unless-stopped
  # which keeps containers stopped when daemon is restarted while they were down)
  &common
  restart: always
  environment:
    TINI_SUBREAPER: "1"
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
  # ── Memory overflow protection: container dies before it kills WSL2 ──
  memswap_limit: 0 # No swap — OOM-kill the container, don't swap (prevents I/O death spiral)
  oom_kill_disable: false # NEVER disable OOM killer — let Docker kill runaway containers
  labels:
    org.pinetwork.project: "triumph-synergy"
    org.pinetwork.central-node: "GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V"
    org.triumph.blockchain.powered-by: "Pi Network"
    org.triumph.consensus.protocol: "Stellar SCP"
    org.triumph.horizon.layer: "enabled"
    org.triumph.ecosystem.class: "sovereign-quantum-financial"
    org.triumph.positioning: "rival-and-superior-to-usd"
    org.triumph.real-world-utility: "20-plus-sectors"
    org.triumph.gateway: "universal-integration-gateway"
    org.triumph.owner.name: "Jeremiah Joel Drains"
    org.triumph.owner.organization: "Triumph-Synergy"
    org.triumph.governance.final-authority: "owner-approved"
    org.triumph.legal.compliance.required: "true"

x-db-env: &db-env
  POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
  REDIS_URL: redis://triumph-redis:6379
  # Supabase keys (set in .env or secrets manager for production)
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://your-project.supabase.co}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-anon-key}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
  SUPABASE_DB_URL: ${SUPABASE_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}}

x-pi-env: &pi-env
  PI_NETWORK_MODE: ${PI_NETWORK_MODE:-mainnet}
  # Mainnet-only ecosystem — no testnet keys
  PI_API_KEY: ${PI_API_KEY:?PI_API_KEY required}
  PI_INTERNAL_API_KEY: ${PI_INTERNAL_API_KEY:?PI_INTERNAL_API_KEY required}
  PI_MAINNET_API_KEY: ${PI_MAINNET_API_KEY:?PI_MAINNET_API_KEY required}
  PI_API_SECRET: ${PI_API_SECRET:?PI_API_SECRET required}
  PI_API_URL: ${PI_API_URL:-https://api.minepi.com}
  # Pi Platform API /v2/me validators per network (testnet trigger support).
  PI_PLATFORM_API_URL: ${PI_PLATFORM_API_URL:-https://api.minepi.com/v2/me}
  PI_PLATFORM_API_TESTNET_URL: ${PI_PLATFORM_API_TESTNET_URL:-https://api.minepi.com/v2/me}
  NEXT_PUBLIC_PI_APP_ID: ${NEXT_PUBLIC_PI_APP_ID:-triumph-synergy}
  NEXT_PUBLIC_PI_SANDBOX: ${NEXT_PUBLIC_PI_SANDBOX:-false}
  PI_SUPERNODE_ADDRESS: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
  PI_SUPERNODE_MODE: "true"
  # Pi App Wallets (Developer Portal-issued) — canonical TRISYN issuer
  # and Pioneer airdrop source. SAIB-enforced allowlist destinations.
  PI_APP_WALLET_TESTNET: GC4ZAPK6QOEX2JJQBTQW2GVCYW3AI7NRYFNZUSE343S5OIK6G4FBM7XP
  PI_APP_WALLET_MAINNET: ${PI_APP_WALLET_MAINNET:-}
  TRISYN_ISSUER_TESTNET: GC4ZAPK6QOEX2JJQBTQW2GVCYW3AI7NRYFNZUSE343S5OIK6G4FBM7XP
  PI_TRISYN_DISTRIBUTOR_TESTNET: ${PI_TRISYN_DISTRIBUTOR_TESTNET:-GDINCI6L7M3J3YTUEMSX3SP2OD7VBJEVX6DTC3BHLD4SD4CMVQ2DVTMF}
  PIONEER_AIRDROP_SOURCE_TESTNET: GC4ZAPK6QOEX2JJQBTQW2GVCYW3AI7NRYFNZUSE343S5OIK6G4FBM7XP
  STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://api.mainnet.minepi.com}
  STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-Pi Network}
  # ── Protocol 24 Explicit Enforcement ──────────────────────────────────────
  # Pi mainnet ONLY runs SCP Protocol 24 (stellar-core v24.0.0).
  # This is immutable per pinetwork/pi-node-docker:organization-mainnet-v1.0-p24.1.0
  PI_PROTOCOL_VERSION: "24"
  STELLAR_CORE_VERSION: v24.0.0
  PI_MIN_SUPPORTED_PROTOCOL: "23"
  # ──────────────────────────────────────────────────────────────────────────
  CENTRAL_NODE_URL: http://triumph-central-node:8083
  CENTRAL_NODE_PUBLIC_KEY: GA6Z5STFJZPBDQT5VZSDUTCKLXXB626ONTLRWBJAWYKLH4LKPIZCGL7V
  # Pi Node accessible via pi-bridge network (container name) and host.
  # Default target is the self-hosted MAINNET node (triumph-pi-mainnet-node).
  # Override PI_NODE_CONTAINER in .env to change the Pi node target.
  PI_NODE_HOST: ${PI_NODE_CONTAINER:-triumph-pi-mainnet-node}
  PI_NODE_PORT: ${PI_NODE_PORT:-31502}
  PI_NODE_API_PORT: ${PI_NODE_API_PORT:-8000}
  PI_NODE_PEER_PORT: ${PI_NODE_PEER_PORT:-31502}
  # ── App-layer node addressing (lib/pi-node/registry.ts) ──
  # Defaults to the in-compose mainnet node container; override to
  # host.docker.internal when running against a host-side Pi Desktop node,
  # or to the public mainnet API for cloud-only deploys.
  PI_NODE_ROOT_HOST: ${PI_NODE_ROOT_HOST:-triumph-pi-mainnet-node}
  PI_NODE_ROOT_REGION: ${PI_NODE_ROOT_REGION:-us-east-1}
  PI_NODE_VERSION_DISPLAY: ${PI_NODE_VERSION_DISPLAY:-5.4}
  PI_NODE_ROOT_PORTS: ${PI_NODE_ROOT_PORTS:-31501,31502,31503,31500,31404,31405,31406,31407,31408,31409}
  # ── ULTIMATE SUPERIOR APEX-QUANTUM MESH (May 3, 2026) ──────────────────
  # Auto-injected into every chain-touching service via `<<: *pi-env` so
  # the entire ecosystem speaks one language: SCP-v24 + PQ-required +
  # SAIB-enforced + Pi mainnet supernode backbone.
  PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
  QUANTUM_SHIELD_URL: http://triumph-quantum-intel-fortress:8094
  QUANTUM_FORTRESS_URL: http://triumph-quantum-intel-fortress:8094
  SAIB_URL: http://triumph-sovereign-fortress:8099
  SAIB_ENFORCE: "true"
  SAIB_GLOBAL_ENFORCEMENT: "true"
  SAIB_ECOSYSTEM_GUARDIAN: "true"
  SOVEREIGN_PQ_ENFORCE: "true"
  CONTROL_PLANE_REQUIRE_PQ_READY: "true"
  SCP_REQUIRE_PQ_SIGNATURE: "true"
  STELLAR_CONSENSUS_PROTOCOL: scp-v24
  CENTRAL_NODE_ROLE: supernode
  CENTRAL_NODE_BACKBONE: "true"
  APEX_QUANTUM_MESH: "true"
  APEX_LOOPHOLES_ENFORCED: "true"
  GLOBAL_USAGE_READY: "true"
  # Apex-Quantum peer-supernode mesh (mutually powered, auto-upgrade joining nodes)
  SUPERNODE_PEERS: "http://triumph-supernode-peer-2:11626"
  APEX_AUTO_UPGRADE: "true"

services:
  # ========================================================================
  # INFRASTRUCTURE
  # ========================================================================

  postgres:
    # pgvector/pgvector:pg16 — official pgvector image, drop-in compatible with postgres:16,
    # adds the `vector` extension SAIB RAG needs for similarity search.
    image: pgvector/pgvector:pg16
    container_name: triumph-postgres
    stop_grace_period: 60s # Allow WAL flush + checkpoint before SIGKILL prevents crash-recovery loops
    <<: *common
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    oom_score_adj: -500 # Protect database — last to OOM-kill
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triumph_synergy}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    # Internal only — no host port exposure
    expose:
      - "5432"
    volumes:
      - triumph_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    networks:
      - triumph-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-triumph_synergy}" ]
      interval: 120s
      timeout: 60s
      retries: 5
      start_period: 120s

  redis:
    image: redis:7-alpine
    container_name: triumph-redis
    stop_grace_period: 30s # Allow RDB/AOF flush before SIGKILL
    <<: *common
    mem_limit: 192m # was 128m — AOF fsync + RDB fork spikes need headroom
    mem_reservation: 96m # was 64m
    cpus: 0.3
    oom_score_adj: -500 # Protect cache — last to OOM-kill
    # Internal only — no host port exposure
    expose:
      - "6379"
    volumes:
      - triumph_redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - triumph-net
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 120s
      timeout: 60s
      retries: 5
      start_period: 120s

  # ========================================================================
  # PI BRIDGE CONNECTOR — Central Node ↔ Pi Mainnet Node live link
  # Polls triumph-pi-mainnet-node:8000 (Horizon) every 5s, publishes to Redis, routes txs
  # ========================================================================

  pi-bridge-connector:
    build:
      context: docker/pi-bridge-connector
    container_name: triumph-pi-bridge-connector
    <<: *common
    mem_limit: 512m
    mem_reservation: 192m
    cpus: 0.60 # quantum-managed: T5 mesh peer (bridge poller) — bumped for httpx+SSE+push loops
    environment:
      <<: [ *db-env, *pi-env ]
      PYTHONUNBUFFERED: "1"
      PORT: "8092"
      PI_NODE_HOST: ${PI_NODE_CONTAINER:-triumph-pi-mainnet-node}
      PI_NODE_API_PORT: 8000
      PI_NODE_PEER_PORT: ${PI_NODE_PEER_PORT:-31502}
      # Fallback chain: local mainnet host port → public mainnet API
      PI_NODE_FALLBACK_URL: ${PI_NODE_FALLBACK_URL:-http://host.docker.internal:31501}
      PI_NODE_PUBLIC_FALLBACK_URL: ${PI_NODE_PUBLIC_FALLBACK_URL:-https://api.mainnet.minepi.com}
      PI_POLL_RETRIES: "3"
      PI_POLL_RETRY_DELAY_S: "2.0"
      POLL_INTERVAL_S: "15"
      CENTRAL_NODE_URL: http://triumph-central-node:8083
      # Direct container name — not alias — avoids DNS resolution failure if alias not ready
      QUANTUM_SHIELD_URL: http://triumph-quantum-intel-fortress:8094
      SOVEREIGN_PQ_ENFORCE: "true"
      # ── Public-site bridge (Docker <-> triumphsynergyab2099.pinet.com)
      # Outbound only — works behind NAT/CGNAT. Set PUBLIC_BRIDGE_TOKEN to enable.
      PUBLIC_BRIDGE_URLS: ${PUBLIC_BRIDGE_URLS:-https://triumphsynergyab2099.pinet.com}
      PUBLIC_BRIDGE_TOKEN: ${PUBLIC_BRIDGE_TOKEN:-}
      PUBLIC_BRIDGE_NODE_ID: ${PUBLIC_BRIDGE_NODE_ID:-docker-desktop-primary}
      PUBLIC_BRIDGE_PUSH_INTERVAL_S: ${PUBLIC_BRIDGE_PUSH_INTERVAL_S:-10}
    expose:
      - "8092"
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=40)" ]
      interval: 120s
      timeout: 90s # Docker Desktop Mac VM: Python cold-start + urllib can take >60s
      retries: 5
      start_period: 300s

  # ========================================================================
  # PI CENTRAL NODE — Stellar Core Integration
  # ========================================================================

  # NOTE: central-node folded into super-pod (see aliases). Standalone removed.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triumph-app
    <<: *common
    mem_limit: 1536m    # raised 512m→1536m — Next.js needs headroom for millions of concurrent SSR renders
    mem_reservation: 768m
    cpus: 2.0  # raised 0.50→2.0 — sovereign Next.js app must handle multi-million Pioneer traffic
    ports:
      - "3000:3000"
    environment:
      <<: [ *db-env, *pi-env ]
      NODE_ENV: production
      DOCKER_BUILD: "true"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://triumphsynergy.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://triumphsynergy.com}
      BACKEND_URL: ${BACKEND_URL:-https://triumphsynergy.com/api}
      INTERNAL_PI_MULTIPLIER: ${INTERNAL_PI_MULTIPLIER:-1.5}
      INTERNAL_PI_MIN_VALUE: ${INTERNAL_PI_MIN_VALUE:-10.0}
      EXTERNAL_PI_MIN_VALUE: ${EXTERNAL_PI_MIN_VALUE:-1.0}
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # PROTOCOL 24 & CENTRAL NODE CONNECTION (EMBEDDED IN GOVERNANCE-SHIELD)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      PI_PROTOCOL_VERSION: "24"
      STELLAR_CORE_VERSION: "v24.0.0"
      STELLAR_CORE_PROTOCOL: "24"
      STELLAR_NETWORK_PASSPHRASE: "Pi Network"
      GOVERNANCE_SHIELD_URL: "http://triumph-governance-shield:11626"
      GOVERNANCE_SHIELD_HEALTH_URL: "http://triumph-governance-shield:11626/health"
      CENTRAL_NODE_PROTOCOL_URL: "http://triumph-governance-shield:11626/info"
      SUPERNODE_SCP_URL: "http://triumph-governance-shield:11626/scp"
      SUPERNODE_STATUS_URL: "http://triumph-governance-shield:11626/supernode/status"
      SUPERNODE_PEERS_URL: "http://triumph-governance-shield:11626/supernode/peers"
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      NANO_SAIB_URL: http://triumph-sovereign-nano-saib:8201
      SAIB_TOKEN: ${SAIB_TOKEN:-}
      SAIB_FOUNDER_TOKEN: ${SAIB_FOUNDER_TOKEN:?SAIB_FOUNDER_TOKEN required — set a 64-char hex secret}
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      governance-shield:
        condition: service_started
      sovereign-nano-saib:
        condition: service_started
    networks:
      - triumph-net
      - pi-bridge
    healthcheck:
      disable: true
  # ========================================================================
  # PI TRANSACTION ENGINE — High-Throughput Processing
  # ========================================================================

  # NOTE: transaction-engine folded into super-pod (see aliases). Standalone removed.

  vault:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile
    container_name: triumph-vault
    <<: *common
    mem_limit: 96m
    mem_reservation: 48m
    cpus: 0.20 # quantum-managed: T6 sidekick (vault)
    environment:
      <<: [ *db-env, *pi-env ]
      VAULT_MODE: trillion
      QUANTUM_ENCRYPTION: "true"
      NODE_OPTIONS: "--max-old-space-size=96"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
    volumes:
      - triumph_vault_data:/app/data
    networks:
      - triumph-net
      - pi-bridge
    depends_on:
      governance-shield:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 120s
      timeout: 60s
      retries: 5
      start_period: 120s

  # ========================================================================
  # PI SMART CONTRACTS — Execution Engine
  # ========================================================================

  # NOTE: smart-contracts folded into super-pod (see aliases). Standalone removed.

  # NOTE: scp-upgrader folded into super-pod (see aliases). Standalone removed.

  nginx:
    image: nginx:alpine
    container_name: triumph-nginx
    <<: *common
    mem_limit: 384m    # raised 96m→384m — nginx cache (pages+static+images) needs memory
    mem_reservation: 192m
    cpus: 1.0  # raised 0.20→1.0 — nginx handles ALL inbound traffic for millions of Pioneers
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/nginx:/etc/nginx/certs:ro
      - ./html_storefronts:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_started
      quantum-intel-fortress:
        condition: service_started
      sovereign-military-bridge:
        condition: service_started
    networks:
      - triumph-net
    healthcheck:
      disable: true

  # ========================================================================
  # SAIB ENFORCER — Sidecar bridge between real-world and digital ecosystem.
  # Routes /api/saib/enforce to credit bureaus, judicial systems, tokenization,
  # HQ (apex-sovereign-nexus), and vault. Every action emits an immutable
  # sha256 receipt anchored (best-effort) to Pi mainnet via settlement-core.
  # Founder-token gated for all mutating actions.
  # ========================================================================
  saib-enforcer:
    build:
      context: docker/saib-enforcer
      dockerfile: Dockerfile
    image: triumph-synergy-saib-enforcer:latest
    container_name: triumph-saib-enforcer
    <<: *common
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.30
    environment:
      PORT: "8210"
      SAIB_FOUNDER_TOKEN: ${SAIB_FOUNDER_TOKEN:?SAIB_FOUNDER_TOKEN required}
      SAIB_TOKEN: ${SAIB_TOKEN:-}
      PUBLIC_BRIDGE_TOKEN: ${PUBLIC_BRIDGE_TOKEN:-}
      CREDIT_ENGINE_URL: http://triumph-credit-engine:8091
      JUDICIAL_SERVICE_URL: http://triumph-governance-shield:8096
      SETTLEMENT_CORE_URL: http://triumph-settlement-core:8080
      TOKEN_ENGINE_URL: http://triumph-settlement-core:8089
      VAULT_URL: http://triumph-vault:8081
      HQ_NEXUS_URL: http://triumph-sovereign-nano-saib:8201
      NANO_SAIB_URL: http://triumph-sovereign-nano-saib:8201
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      DUAL_VALUE_URL: http://triumph-dual-value-engine:8093
      APP_URL: http://triumph-app:3000
      PI_PROTOCOL_VERSION: "24"
      PI_LEDGER_STALL_SEC: "180"
      PI_INGEST_LAG_LEDGER_THRESHOLD: "10"
      DUTY_ENABLED: "true"
      DUTY_PI_CHAIN_SEC: "180"
      DUTY_MARKET_ECON_SEC: "300"
      DUTY_CEO_SEC: "300"
      CEO_AUTO_REPAIR: "true"
      CEO_AUTO_ACK_STALE: "true"
      CEO_AUTO_HEAL: "true"
      CEO_MAX_ACTIONS: "6"
      CEO_ESCALATION_COOLDOWN_SEC: "1800"
      MARKET_SPREAD_EXTREME_RATIO: "3.0"
      MARKET_SPREAD_DISCOUNT_RATIO: "0.5"
      MARKET_BLUEPRINT_COOLDOWN_SEC: "1800"
    secrets:
      - public_bridge_token
    expose:
      - "8210"
    networks:
      - triumph-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8210/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  # ========================================================================
  # MARKET DATA SERVICE — Live Pi Horizon data relay
  # ========================================================================

  # NOTE: market-data folded into super-pod (see aliases). Standalone removed.

  # NOTE: blockchain-oracle folded into super-pod (see aliases). Standalone removed.

  # NOTE: compliance folded into super-pod (see aliases). Standalone removed.

  # NOTE: dex folded into super-pod (see aliases). Standalone removed.

  # NOTE: ml-engine folded into super-pod (see aliases). Standalone removed.

  # NOTE: apex-credit-prime folded into super-pod (see aliases). Standalone removed.

  # NOTE: quantum-shield folded into super-pod (see aliases). Standalone removed.

  # NOTE: tokenization-engine folded into super-pod (see aliases). Standalone removed.

  # NOTE: horizon-guardian folded into super-pod (see aliases). Standalone removed.

  # NOTE: judicial-monitor folded into super-pod (see aliases). Standalone removed.

  # NOTE: health-governor folded into super-pod (see aliases). Standalone removed.

  # NOTE: network-sentinel folded into super-pod (see aliases). Standalone removed.

  governance-shield:
    build:
      context: .
      dockerfile: docker/governance-shield/Dockerfile
    container_name: triumph-governance-shield
    <<: *common
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 0.80 # quantum-managed: T4 governance-shield (central node) — bumped after OOM
    environment:
      <<: [ *db-env, *pi-env ]
      NODE_TYPE: central
      NODE_PRIORITY: supreme
      STELLAR_CORE_HTTP_PORT: 11626
      AUTO_UPGRADE: "true"
      ZERO_DOWNTIME: "true"
      ROLLBACK_ON_FAILURE: "true"
      VERSION_CHECK_INTERVAL_MS: 300000 # CPU-optimized: was 60000
      PARAMETER_SYNC_INTERVAL_MS: 120000 # CPU-optimized: was 30000
      PI_MAINNET_HORIZON: https://api.mainnet.minepi.com
      PI_TESTNET_HORIZON: https://api.testnet.minepi.com
      PI_LOCAL_HORIZON: http://${PI_NODE_CONTAINER:-triumph-pi-mainnet-node}:${PI_NODE_API_PORT:-8000}
      NETWORK_TYPE: ${PI_NETWORK_MODE:-mainnet}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
      COMPLIANCE_REQUIRE_PQ: "true"
      JUDICIAL_REQUIRE_PQ: "true"
      SCP_REQUIRE_PQ_SIGNATURE: "true"
      SUPERNODE_ROLE: primary
      SUPERNODE_ID: triumph-central-node
      SUPERNODE_SELF_URL: http://triumph-central-node:11626
      # ── EXPLICIT Protocol 24 Override ──
      # Central node ALWAYS reports Protocol 24, even if local Horizon returns stale data.
      # This ensures the supernode backbone correctly declares SCP v24 compliance.
      PI_PROTOCOL_VERSION: "24"
      STELLAR_CORE_VERSION: v24.0.0
      # Shared secret for /supernode/join — prevents unauthenticated peer escalation.
      # Must match SUPERNODE_JOIN_SECRET on all peer supernodes.
      SUPERNODE_JOIN_SECRET: ${SUPERNODE_JOIN_SECRET:-}
    volumes:
      - triumph_central_data:/app/data/central
      - triumph_scp_data:/app/data/scp
    expose:
      - "8083"
      - "8087"
      - "8096"
      - "11625"
      - "11626"
    networks:
      triumph-net:
        aliases:
          - triumph-compliance
          - triumph-judicial-monitor
          - triumph-central-node
          - triumph-scp-upgrader
      pi-bridge: {}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pi-bridge-connector:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8083/health" ]
      interval: 90s
      timeout: 45s
      retries: 5
      start_period: 180s

  # ========================================================================
  # SUPERNODE-PEER-2 — Apex-Quantum peer supernode
  # Mutually powers triumph-central-node. Both register each other on
  # /supernode/join. Any node that connects becomes an upgraded
  # APEX-QUANTUM-NODE that boosts the entire mesh.
  # ========================================================================

  supernode-peer-2:
    build:
      context: .
      dockerfile: docker/supernode-peer/Dockerfile
    container_name: triumph-supernode-peer-2
    <<: *common
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.35 # quantum-managed: T4 supernode-peer-2 (SCP)
    environment:
      <<: *pi-env
      SUPERNODE_ROLE: peer
      SUPERNODE_ID: triumph-supernode-peer-2
      SUPERNODE_SELF_URL: http://triumph-supernode-peer-2:11626
      SUPERNODE_PEERS: http://triumph-central-node:11626
      APEX_AUTO_UPGRADE: "true"
      PI_NETWORK_MODE: ${PI_NETWORK_MODE:-mainnet}
      NETWORK_TYPE: ${PI_NETWORK_MODE:-mainnet}
      SCP_REQUIRE_PQ_SIGNATURE: "true"
      SUPERNODE_JOIN_SECRET: ${SUPERNODE_JOIN_SECRET:-}
      # ── SCP Protocol version tracking ─────────────────────────────────
      # Overridden dynamically at runtime by polling Pi Horizon ledger.
      # Set here as a known-good fallback; SCP watchdog will update live.
      PI_PROTOCOL_VERSION: ${PI_PROTOCOL_VERSION:-24}
      STELLAR_CORE_VERSION: ${STELLAR_CORE_VERSION:-v24.0.0}
      STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-Pi Network}
      # ── Horizon endpoints (mainnet + testnet) ──────────────────────────
      PI_MAINNET_HORIZON: https://api.mainnet.minepi.com
      PI_TESTNET_HORIZON: https://api.testnet.minepi.com
      # ── SAIB notification target ────────────────────────────────────────
      NANO_SAIB_URL: http://triumph-sovereign-nano-saib:8201
      SAIB_SERVICE_TOKEN: ${SAIB_SERVICE_TOKEN:-}
    expose:
      - "11626"
    networks:
      triumph-net:
        aliases:
          - triumph-supernode-peer-2
          - triumph-apex-quantum-peer
      pi-bridge: {}
    depends_on:
      pi-bridge-connector:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:11626/info" ]
      interval: 90s
      timeout: 45s
      retries: 5
      start_period: 180s

  # ========================================================================
  # SETTLEMENT-CORE — Super-Pod
  # transaction-engine + smart-contracts + tokenization-engine + dex
  # ========================================================================

  settlement-core:
    build:
      context: .
      dockerfile: docker/settlement-core/Dockerfile
    container_name: triumph-settlement-core
    <<: *common
    mem_limit: 512m
    mem_reservation: 192m
    cpus: 0.65 # quantum-managed: T4 settlement-core — bumped: live 59% CPU
    environment:
      <<: [ *db-env, *pi-env ]
      ENGINE_MODE: hyper
      NODE_OPTIONS: "--max-old-space-size=512 --unhandled-rejections=warn"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}
      EXECUTION_CHANNELS: 10000
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      TRANSACTION_REQUIRE_PQ_SIGNATURE: "true"
      SMART_CONTRACTS_REQUIRE_PQ_SIGNATURE: "true"
      TOKENIZATION_REQUIRE_PQ_SIGNATURE: "true"
      DEX_REQUIRE_PQ_SIGNATURE: "true"
      # ─── Stellar / Pi on-chain broadcaster ─────────────────────────────
      # Default OFF until a STELLAR_SECRET_KEY is provided in .env.
      # Set STELLAR_BROADCAST_ENABLED=true to submit real transactions.
      STELLAR_BROADCAST_ENABLED: ${STELLAR_BROADCAST_ENABLED:-false}
      STELLAR_SECRET_KEY: ${STELLAR_SECRET_KEY:-}
      STELLAR_TREASURY_ADDRESS: ${STELLAR_TREASURY_ADDRESS:-}
      STELLAR_TX_TIMEOUT_SEC: ${STELLAR_TX_TIMEOUT_SEC:-180}
    volumes:
      - triumph_tx_data:/app/data/tx
      - triumph_contracts_data:/app/data/contracts
      - triumph_tokenization_data:/app/data/tokens
    expose:
      - "8080"
      - "8082"
      - "8084"
      - "8088"
      - "8089"
    networks:
      triumph-net:
        aliases:
          - triumph-transaction-engine
          - triumph-smart-contracts
          - triumph-tokenization-engine
          - triumph-dex
          # Payment processor lives on port 8084 of this super-pod;
          # alias keeps SAIB & legacy callers happy without an env override.
          - triumph-payment-processor
      pi-bridge: {}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      governance-shield:
        condition: service_started
    healthcheck:
      disable: true

  # ════════════════════════════════════════════════════════════════════════
  # QUANTUM-INTEL-FORTRESS — Apex Super-Pod (5 services → 1 container)
  #
  # Consolidates financial-intel + quantum-fortress to reduce daemon load:
  #   ml-engine          (8090) — scikit-learn / statsmodels predictions
  #   credit-engine      (8091) — PiCredit Score™
  #   dual-value-engine  (8093) — internal/external Pi valuation
  #   quantum-shield     (8094) — ML-KEM-1024 + ML-DSA-87 + SPHINCS+
  #   qpu-bridge         (8098) — QPU interface bridge
  #
  # Legacy hostnames preserved as network aliases — zero downstream config changes.
  # RAM: 1280m (saves ~256m vs 2 separate container overheads)
  # ════════════════════════════════════════════════════════════════════════

  quantum-intel-fortress:
    build:
      context: docker
      dockerfile: quantum-intel-fortress/Dockerfile
    container_name: triumph-quantum-intel-fortress
    <<: *common
    mem_limit: 768m
    mem_reservation: 320m
    cpus: 0.60 # quantum-managed: T4 quantum-intel-fortress — raised 640m→768m (was at 78%)
    environment:
      <<: [ *db-env, *pi-env ]
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PORT: "8094"
      QPU_PORT: "8098"
    expose:
      - "8090"
      - "8091"
      - "8093"
      - "8094"
      - "8098"
    networks:
      triumph-net:
        aliases:
          # financial-intel legacy aliases
          - triumph-credit-engine
          - triumph-ml-engine
          - triumph-dual-value-engine
          - triumph-financial-intel # backward-compat: ML_ENGINE_URL references
          # quantum-fortress legacy aliases
          - triumph-quantum-shield
          - triumph-qpu-bridge # port 8098 — governor health probe target
          - triumph-quantum-fortress # backward-compat: QUANTUM_SHIELD_URL references
    depends_on:
      redis:
        condition: service_healthy
    # SPHINCS+ keygen is slow on Docker Desktop Mac VM — disable healthcheck
    healthcheck:
      disable: true
  # ========================================================================
  # APEX-SERVICES — Mega Super-Pod (18 services in one container)
  # ========================================================================
  # Consolidates the three previously-standalone sovereign super-pods:
  #   sovereign-fortress   (5 svc, 8097-8102) — ai-bot + gateway + delivery
  #                                              + pidex + sports-hub
  #   sovereign-insurance  (7 svc, 8110-8116) — life + home + health + auto
  #                                              + dental + vision + hospital
  #   sovereign-utilities  (6 svc, 8120-8125) — electric + water + gas + hoa
  #                                              + plumbing + hvac
  # Removes 2 redundant Python/supervisord overheads (~150 MB savings).
  # All hostname aliases preserved for backwards-compatible service URLs.
  # ========================================================================

  apex-services:
    build:
      context: docker
      dockerfile: apex-services/Dockerfile
    platform: linux/arm64
    container_name: triumph-apex-services
    <<: *common
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 1.00 # quantum-managed: T2 apex-services (18-svc mega-pod) — raised 1024m→1536m (was at 83%)
    environment:
      <<: [ *db-env, *pi-env ]
      PI_INTERNAL_RATE: "314159.0"
      PI_EXTERNAL_RATE: "314.159"
      PI_INTERNAL_MULTIPLIER: "1000.0"
      AI_BOT_REQUIRE_PQ: "true"
      GATEWAY_REQUIRE_PQ: "true"
      QUANTUM_FORTRESS_URL: http://triumph-quantum-fortress:8094
      PAYMENT_PROCESSOR_URL: http://triumph-settlement-core:8084
      CLOUD_MEMORY_URL: http://triumph-observability-stack:8095
      # ── SAIB Docker restart authority ────────────────────────────────────
      DOCKER_HOST: unix:///var/run/docker.sock # ── SAIB GitHub self-awareness ─────────────────────────────────────────
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: jdrains110-beep/Triumph-Synergy-Digital-Financial-Ecosystem
      SAIB_GITHUB_SYNC_HOURS: "6"
      # ── SAIB GitHub visitor interaction ────────────────────────────────
      SAIB_GITHUB_INTERACT_ENABLED: "true"
      SAIB_GITHUB_GREETING_ENABLED: "true" # SAIB auto-greets first-time visitors
      SAIB_GITHUB_VISITOR_PRIVACY: "partial" # partial | full | anon
      SAIB_GITHUB_VISITOR_POLL_S: "300"
      # ── SAIB network switching ────────────────────────────────────
      SAIB_NETWORK_SWITCH_ENABLED: "true"
      SAIB_BACKUP_NETWORKS: "pi-bridge"
      # ── Step 4: Citus horizontal Postgres sharding (opt-in) ─────────
      # Override single-node POSTGRES_URL to use the Citus coordinator instead.
      POSTGRES_URL: ${SAIB_POSTGRES_URL:-postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}}
      SAIB_REPLICA_ID: ${SAIB_REPLICA_ID:-apex-services-0}
      # ── Step 5: Redis Cluster (opt-in) ───────────────────────────────
      # When set, SAIB uses RedisCluster client; falls back to REDIS_URL otherwise.
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-}
      # ── Step 6: Multi-region active-active ─────────────────────────────
      # SAIB_REGION labels this pod's region; SAIB_REGION_PEERS is a comma list
      # of peer-region SAIB base URLs that /region will health-check.
      SAIB_REGION: ${SAIB_REGION:-region-a}
      SAIB_REGION_PEERS: ${SAIB_REGION_PEERS:-}
      # ── SAIB Apex Supreme Quantum Brain ──────────────────────────────
      SAIB_QUANTUM_BRAIN_ENABLED: "true"
      SAIB_QUANTUM_CODE_SCAN_INTERVAL_S: "3600" # 60 min (CPU-optimized: was 30 min)
      SAIB_QUANTUM_IMAGE_SCAN_INTERVAL_S: "7200" # 120 min (CPU-optimized: was 60 min)
      SAIB_QUANTUM_AUTO_BUILD: "false" # set true to auto-rebuild vulnerable images
      SAIB_QUANTUM_AUTO_COMMIT: "false"
      SAIB_CODEBASE_SCAN_PATH: "/workspace"
      SAIB_DOCKER_BUILD_CONTEXT: "/workspace/docker"
      # ── External mainnet probes (PiNet + Pi mainnet API) ────
      # No hardcoded host defaults — Pi App Studio assigns a fresh hostname
      # on every app transfer. Set SAIB_PINET_HOSTS in
      # your environment to point at the current canonical domain(s); leaving
      # it empty disables those probes.
      SAIB_PINET_HOSTS: ${SAIB_PINET_HOSTS:-}
      SAIB_EXTERNAL_PROBE_INTERVAL_S: "60"
      SAIB_REMEDIATION_COOLDOWN_S: "900"
      # ── Peer federation (2 Docker Desktops + central/supernode SAIB) ──
      # Format: name1=https://host:8099,name2=https://host:8099,central=https://...
      SAIB_PEERS: ${SAIB_PEERS:-}
      SAIB_PEER_NAME: ${SAIB_PEER_NAME:-docker-desktop-primary}
      SAIB_PEER_POLL_S: "30"
      SAIB_PEER_OFFLINE_S: "120"
      # ── SAIB External-Learning Ingestion (Stack Overflow, Reddit, Web, Discord, X) ──
      # Free / anonymous sources are ON by default; paid/API-key sources stay dormant
      # until credentials are supplied. Each source can be disabled individually with
      # SAIB_<NAME>_ENABLED=false (e.g. SAIB_STACKOVERFLOW_ENABLED=false).
      SAIB_STACKOVERFLOW_ENABLED: "${SAIB_STACKOVERFLOW_ENABLED:-true}"
      SAIB_REDDIT_ENABLED: "${SAIB_REDDIT_ENABLED:-true}"
      SAIB_WEB_CRAWLER_ENABLED: "${SAIB_WEB_CRAWLER_ENABLED:-true}"
      SAIB_SO_TAGS: "${SAIB_SO_TAGS:-pi-network,stellar,blockchain,fastapi,nextjs}"
      SAIB_REDDIT_SUBREDDITS: "${SAIB_REDDIT_SUBREDDITS:-PiNetwork,Stellar,CryptoCurrency,fastapi,nextjs}"
      SAIB_REDDIT_KEYWORDS: "${SAIB_REDDIT_KEYWORDS:-}"
      SAIB_CRAWLER_SEEDS: "${SAIB_CRAWLER_SEEDS:-https://minepi.com/blog,https://developers.minepi.com,https://stellar.org/blog}"
      # Dormant unless creds present
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_GUILD_IDS: "${DISCORD_GUILD_IDS:-}"
      X_BEARER_TOKEN: "${X_BEARER_TOKEN:-}"
      SAIB_X_QUERY: "${SAIB_X_QUERY:-(#TriumphSynergy OR #PiNetwork OR @TriumphSynergy) -is:retweet lang:en}"
      # ── GitHub interaction ingestion (stars, forks, watchers, issues, PRs, sponsors) ──
      SAIB_GITHUB_EVENTS_ENABLED: "${SAIB_GITHUB_EVENTS_ENABLED:-true}"
      SAIB_GITHUB_REPO: "${SAIB_GITHUB_REPO:-jdrains110-beep/Triumph-Synergy-Digital-Financial-Ecosystem}"
      SAIB_GITHUB_EXTRA_REPOS: "${SAIB_GITHUB_EXTRA_REPOS:-}"
      SAIB_GITHUB_OWNERS: "${SAIB_GITHUB_OWNERS:-jdrains110-beep}"
      SAIB_GITHUB_EVENTS_INTERVAL_S: "${SAIB_GITHUB_EVENTS_INTERVAL_S:-300}"
      # ── Nano Sovereign Self-Awareness (walk /workspace into pgvector RAG) ──
      # SAIB reads the entire repo (frontend → backend) so it can answer
      # semantic questions about its own implementation via /saib/repo/query.
      SAIB_SELF_REPO_ENABLED: "${SAIB_SELF_REPO_ENABLED:-true}"
      SAIB_SELF_REPO_ROOT: "${SAIB_SELF_REPO_ROOT:-/workspace}"
      SAIB_SELF_REPO_INTERVAL_S: "${SAIB_SELF_REPO_INTERVAL_S:-21600}"
      SAIB_SELF_REPO_MAX_FILES: "${SAIB_SELF_REPO_MAX_FILES:-3000}"
      SAIB_SELF_REPO_MAX_FILE_BYTES: "${SAIB_SELF_REPO_MAX_FILE_BYTES:-120000}"
      # Execution is OFF by default. Opt in with a JSON allowlist:
      #   SAIB_REPO_EXEC_ALLOWLIST='{"trisyn-status":["npm","run","trisyn:status"]}'
      SAIB_REPO_EXEC_ALLOWLIST: "${SAIB_REPO_EXEC_ALLOWLIST:-}"
      SAIB_REPO_EXEC_TIMEOUT_S: "${SAIB_REPO_EXEC_TIMEOUT_S:-60}"
      # ── SAIB RAG (pgvector + embeddings) ──────────────────────────────
      SAIB_RAG_ENABLED: "${SAIB_RAG_ENABLED:-true}"
      SAIB_RAG_DSN: "${SAIB_RAG_DSN:-postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}}"
      SAIB_RAG_TABLE: "${SAIB_RAG_TABLE:-saib_knowledge_chunks}"
      SAIB_EMBED_MODEL: "${SAIB_EMBED_MODEL:-all-MiniLM-L6-v2}"
      SAIB_EMBED_DIM: "${SAIB_EMBED_DIM:-384}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    secrets:
      - github_token
    volumes:
      # Mount Docker socket so SAIB can restart any container that fails health probes
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only codebase mount — enables SAIB quantum brain filesystem scanning
      - ./:/workspace:ro
      # SAIB-only secrets (chmod 700 host-side; read-only in-container).
      # Outside processes / other containers cannot read these.
      - ./docker/saib-secrets:/run/saib-secrets:ro
    expose:
      - "8097"
      - "8099"
      - "8100"
      - "8101"
      - "8102"
      - "8110"
      - "8111"
      - "8112"
      - "8113"
      - "8114"
      - "8115"
      - "8116"
      - "8120"
      - "8121"
      - "8122"
      - "8123"
      - "8124"
      - "8125"
    networks:
      triumph-net:
        aliases:
          # Preserve legacy hostnames so other pods don't need updates
          - triumph-sovereign-fortress
          - triumph-sovereign-insurance
          - triumph-sovereign-utilities
          - triumph-sovereign-gateway
          - triumph-sovereign-ai-bot # governor health probe: :8099/health
      pi-bridge:
        aliases:
          - triumph-sovereign-fortress
          - triumph-sovereign-insurance
          - triumph-sovereign-utilities
          - triumph-sovereign-gateway
          - triumph-sovereign-ai-bot
      # Step 5: Redis Cluster — join the cluster network so SAIB can reach
      # redis-node-{1-6} by hostname when REDIS_CLUSTER_NODES is set.
      redis-cluster-net: {}
    depends_on:
      redis:
        condition: service_healthy
      quantum-intel-fortress:
        condition: service_started
      settlement-core:
        condition: service_started
    # Dockerfile has HEALTHCHECK that probes 8099/8112/8120; disable in compose
    # so a slow supervisord startup doesn't trigger false (unhealthy).
    # saib-watchdog handles SAIB health and resurrection externally.
    healthcheck:
      disable: true

  # ========================================================================
  # HORIZON-STREAM — Super-Pod
  # blockchain-oracle + market-data
  # ========================================================================

  horizon-stream:
    build:
      context: .
      dockerfile: docker/horizon-stream/Dockerfile
    container_name: triumph-horizon-stream
    <<: *common
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.30 # quantum-managed: T5 horizon-stream — raised 256m→384m to prevent OOM exit 137
    environment:
      <<: [ *db-env, *pi-env ]
      MARKET_POLL_MS: 5000
      ORACLE_POLL_MS: 5000
    volumes:
      - triumph_stellar_data:/app/data
    expose:
      - "8085"
      - "8086"
    networks:
      triumph-net:
        aliases:
          - triumph-blockchain-oracle
          - triumph-market-data
      pi-bridge: {}
    depends_on:
      redis:
        condition: service_healthy
      pi-bridge-connector:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8085/health" ]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  # ========================================================================
  # OBSERVABILITY-STACK — Super-Pod
  # prometheus + grafana + postgres-exporter + redis-exporter
  # ========================================================================

  observability-stack:
    build:
      context: docker
      dockerfile: observability-stack/Dockerfile
    container_name: triumph-observability-stack
    <<: *common
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 2.0 # SAIB-sovereign: raised 0.70→2.0 to eliminate CPU RUNAWAY alerts (Prometheus+Grafana need headroom)
    ports:
      - "3001:3000"
      - "9090:9090"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@triumph-postgres:5432/${POSTGRES_DB:-triumph_synergy}?sslmode=disable"
      REDIS_ADDR: "redis://triumph-redis:6379"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-triumph_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # ── Cloudflare folded INTO our superior cloud-memory platform ──
      # All values default empty so missing creds simply mark the target
      # as "disabled" instead of breaking sync. Source from .env*.local.
      CLOUDFLARE_ENABLED: ${CLOUDFLARE_ENABLED:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-triumph-cloud-memory}
      CLOUDFLARE_R2_PREFIX: ${CLOUDFLARE_R2_PREFIX:-snapshots}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_KV_NAMESPACE_ID: ${CLOUDFLARE_KV_NAMESPACE_ID:-}
      CLOUDFLARE_KV_KEY: ${CLOUDFLARE_KV_KEY:-triumph-cloud-memory:latest}
      # ── Grafana database tuning — prevent SQLITE_BUSY lock errors ──
      GF_DATABASE_WAL: "true"
      GF_DATABASE_CACHE_MODE: "private"
      GF_DATABASE_MAX_OPEN_CONN: "5"
      # Disable Grafana 12 secrets-management feature (causes
      # "context deadline exceeded" cleanup errors in single-node deployments)
      # Also disable k8s-compatible apiserver for dashboards/alerting (causes
      # "context deadline exceeded" from grafana-apiserver self-calls)
      GF_FEATURE_TOGGLES_DISABLE: "secretsManagementAppPlatform,kubernetesPlaylists,kubernetesDashboards,kubernetesSnapshots,kubernetesRuleGroups,disableEnvelopeEncryption"
      GF_GRAFANA_APP_MODE: "production"
      GF_GRAFANA_APISERVER_ENABLED: "false"
      # Disable usage-stats collection — prevents recurring errors about
      # missing plugins (e.g. grafana-amazonprometheus-datasource not found)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - triumph_prometheus_data:/prometheus
      - triumph_grafana_data:/var/lib/grafana
      - triumph_cloud_memory_backup:/backup
      # SAIB-only secrets (Cloudflare R2 keys, KV token, etc.) — read-only.
      - ./docker/saib-secrets:/run/saib-secrets:ro
    expose:
      - "9121"
      - "9187"
      - "8095"
    networks:
      triumph-net:
        aliases:
          - triumph-cloud-memory # port 8095 — governor health probe target
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

