  # --------------------------------------------------------------------------
  # PI MAINNET NODE — pinetwork/pi-node-docker:organization-mainnet-v1.0-p24.1.0
  # ------------------------------------------------------------------------
  # Protocol 24 (stellar-core v24.1.0 + horizon v24.0.0 + PostgreSQL 16,
  # Ubuntu 24.04). Official Pi Core Team release — no PG migration needed,
  # no reingestion required. Volumes already on PG 16 from v1.1-p23.
  #
  # This is the sovereign on-chain anchor for the Triumph Synergy ecosystem —
  # all Pi payment rails, settlement-core, pi-bridge-connector,
  # tokenization-engine, and SWN/PPH payroll settle against THIS node.
  #
  # Release: https://github.com/PiCoreTeam/pi-node-docker/releases/tag/organization-mainnet-v1.0-p24.1.0
  # Fork: https://github.com/jdrains110-beep/pi-node-docker
  # --------------------------------------------------------------------------
  pi-mainnet-node:
    image: pinetwork/pi-node-docker:organization-mainnet-v1.0-p24.1.0
    platform: linux/amd64 # AMD64-only stellar-core image — required on Apple Silicon / ARM64 hosts
    container_name: triumph-pi-mainnet-node
    restart: always
    profiles: [ "pi-node" ] # opt-in: heavy (3-5 GB RAM for stellar-core sync)
    # p24: bump shm to 2g — stellar-core v24 bucket-merge spikes higher on AMD64 emulation
    shm_size: 2048m
    # Host RAM budget: 4g node + ~3.3g rest of stack = safe on 8g Docker Desktop.
    # Raise mem_limit to 6-7g only after increasing Docker Desktop's RAM allocation.
    mem_limit: 4096m
    mem_reservation: 2048m
    cpus: 2.0 # apply-buckets is CPU-bound under QEMU — give both vCPUs
    environment:
      POSTGRES_PASSWORD: ${PI_NODE_POSTGRES_PASSWORD:-changeme_in_env}
      NODE_PRIVATE_KEY: ${PI_NODE_PRIVATE_KEY:-} # auto-generated if blank
      # ── SAIB Sovereign injection ─────────────────────────────────────────
      # BlockchainWarden monitors this node; these vars allow future startup
      # scripts and internal probes to register with SAIB automatically.
      NANO_SAIB_URL: http://triumph-sovereign-nano-saib:8201
      SAIB_TOKEN: ${SAIB_TOKEN:-}
      SAIB_ENFORCE: "true"
      SAIB_ECOSYSTEM_GUARDIAN: "true"
      PI_BRIDGE_URL: http://triumph-pi-bridge-connector:8092
      # ── Internal peer mesh ───────────────────────────────────────────────
      # Keeps the node in sync with the Triumph SCP quorum on the pi-bridge
      # network. stellar-core's KNOWN_PEERS list is seeded from this var by
      # the startup script so catchup completes via local peers first.
      STELLAR_CORE_KNOWN_PEERS: "triumph-central-node:11626,triumph-supernode-peer-2:11626"
      SUPERNODE_PEERS: "http://triumph-central-node:11626,http://triumph-supernode-peer-2:11626"
      # ── PostgreSQL stability tuning ──────────────────────────────────────
      # Applied via BlockchainWarden ALTER SYSTEM SET after first startup.
      # Also read by some pi-node-docker startup script variants.
      POSTGRES_MAX_CONNECTIONS: "50"
      POSTGRES_SHARED_BUFFERS: "512MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1500MB"
      POSTGRES_WORK_MEM: "16MB"
      POSTGRES_MAINTENANCE_WORK_MEM: "128MB"
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: "0.9"
      POSTGRES_WAL_BUFFERS: "32MB"
      POSTGRES_STATEMENT_TIMEOUT: "300000" # 5 min — stops runaway horizon queries
      POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: "60000"
      POSTGRES_LOG_MIN_DURATION_STATEMENT: "5000" # log slow queries (>5s)
      # ── Self-healing signals ─────────────────────────────────────────────
      # BlockchainWarden reads these to decide which auto-heal actions to take
      STALE_LOCK_AUTO_CLEAR: "true" # warden removes postmaster.pid before restart
      SUPERVISORD_GRACEFUL_SHUTDOWN_S: "30"
      PI_NETWORK_MODE: mainnet
      STELLAR_NETWORK_PASSPHRASE: "Pi Network"
    volumes:
      - pi_mainnet_stellar:/opt/stellar
      - pi_mainnet_logs:/var/log/supervisor
      - pi_mainnet_history:/history
    ports:
      - "31500:11626" # stellar-core HTTP info/admin
      - "${PI_NODE_HORIZON_PORT:-31501}:8000" # Horizon HTTP API
      - "${PI_NODE_PEER_PORT:-31502}:31402" # stellar-core peer
      - "${PI_NODE_HISTORY_PORT:-31503}:1570" # local history server
    command: [ "--mainnet" ]
    depends_on:
      sovereign-nano-saib:
        condition: service_started
    networks:
      - triumph-net
      - pi-bridge
    healthcheck:
      # Lenient check tuned for AMD64 stellar-core under QEMU on Apple Silicon:
      # passes if EITHER stellar-core (11626) OR horizon (8000) responds at all.
      # Apply-buckets + initial sync can take 30-60+ min under emulation, so we
      # do NOT require a specific "state" field — being reachable (any HTTP
      # response, including 4xx/5xx from a live server) is enough.
      test: [ "CMD-SHELL", "curl -fsS --max-time 5 http://localhost:11626/info >/dev/null 2>&1 || curl -fsS --max-time 5 http://localhost:8000/ >/dev/null 2>&1 || curl -sS -o /dev/null --max-time 5 -w '%{http_code}' http://localhost:11626/info 2>/dev/null | grep -qE '^[2345][0-9][0-9]$' || curl -sS -o /dev/null --max-time 5 -w '%{http_code}' http://localhost:8000/ 2>/dev/null | grep -qE '^[2345][0-9][0-9]$' || exit 1" ]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 30m
  # --------------------------------------------------------------------------
