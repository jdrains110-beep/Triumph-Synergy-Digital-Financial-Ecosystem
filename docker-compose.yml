version: "3.9"

services:
  app:
    image: ghcr.io/jdrains110-beep/triumph-synergy-app:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      AUTH_SECRET: "${AUTH_SECRET}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      PI_NETWORK_MODE: "${PI_NETWORK_MODE:-mainnet}"
      NEXT_PUBLIC_PI_APP_ID: "${NEXT_PUBLIC_PI_APP_ID:-triumph-synergy}"
      PI_API_KEY: "${PI_API_KEY}"
      PI_INTERNAL_API_KEY: "${PI_INTERNAL_API_KEY}"
      PI_MAINNET_API_KEY: "${PI_MAINNET_API_KEY}"
      PI_TESTNET_API_KEY: "${PI_TESTNET_API_KEY}"
      PI_SUPERNODE_API_KEY: "${PI_SUPERNODE_API_KEY}"
      SUPERNODE_PUBLIC_KEY: "${SUPERNODE_PUBLIC_KEY}"
      SAIB_PI_WALLET_ADDRESS: "${SAIB_PI_WALLET_ADDRESS}"
      STELLAR_HORIZON_URL: "${STELLAR_HORIZON_URL:-https://api.mainnet.minepi.com}"
      STELLAR_SECRET_KEY: "${STELLAR_SECRET_KEY}"
      REDIS_URL: "redis://redis:6379"
      POSTGRES_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-triumph_synergy}"

  postgres:
    image: ghcr.io/jdrains110-beep/triumph-synergy-postgres:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-triumph_synergy}"

  redis:
    image: ghcr.io/jdrains110-beep/triumph-synergy-redis:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  pi-node:
    image: ghcr.io/jdrains110-beep/triumph-synergy-pi-node:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:31501:31501"
      - "127.0.0.1:31502:31502"
      - "127.0.0.1:31503:31503"
    environment:
      PI_NODE_PRIVATE_KEY: "${PI_NODE_PRIVATE_KEY:-}"
      PI_NODE_POSTGRES_PASSWORD: "${PI_NODE_POSTGRES_PASSWORD}"

  supernode:
    image: ghcr.io/jdrains110-beep/triumph-synergy-supernode:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11626:11626"
    environment:
      PI_SUPERNODE_API_KEY: "${PI_SUPERNODE_API_KEY}"

  saib-v5:
    image: ghcr.io/jdrains110-beep/triumph-synergy-saib-v5:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8210:8210"
    environment:
      REDIS_URL: "redis://redis:6379"
      POSTGRES_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-triumph_synergy}"
      PI_API_KEY: "${PI_API_KEY}"
      PI_INTERNAL_API_KEY: "${PI_INTERNAL_API_KEY}"
      SAIB_PI_WALLET_ADDRESS: "${SAIB_PI_WALLET_ADDRESS}"
      PI_SUPERNODE_API_KEY: "${PI_SUPERNODE_API_KEY}"
      STELLAR_HORIZON_URL: "${STELLAR_HORIZON_URL:-https://api.mainnet.minepi.com}"
      STELLAR_NETWORK_PASSPHRASE: "${STELLAR_NETWORK_PASSPHRASE:-Pi Network}"

  saib-v10:
    image: ghcr.io/jdrains110-beep/triumph-synergy-saib-v10:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8220:8220"
    environment:
      REDIS_URL: "redis://redis:6379"
      POSTGRES_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-triumph_synergy}"
      PI_API_KEY: "${PI_API_KEY}"
      PI_INTERNAL_API_KEY: "${PI_INTERNAL_API_KEY}"
      STELLAR_HORIZON_URL: "${STELLAR_HORIZON_URL:-https://api.mainnet.minepi.com}"
      STELLAR_NETWORK_PASSPHRASE: "${STELLAR_NETWORK_PASSPHRASE:-Pi Network}"

  sovereign-mesh-hub:
    image: ghcr.io/jdrains110-beep/triumph-synergy-sovereign-mesh-hub:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PORT: "8200"
      WG_INTERFACE: wg-sovereign
      WG_LISTEN_PORT: "51820"
      HUB_IP: "10.13.37.2"
      MESH_SUBNET: "10.13.37.0/24"
    volumes:
      - triumph_mesh_keys:/app/keys
    networks:
      sovereign-mesh:
        ipv4_address: 10.13.37.2

networks:
  sovereign-mesh:
    name: triumph-sovereign-mesh
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.37.0/24

volumes:
  triumph_mesh_keys:
