      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash-exp}"
      # OpenRouter free models (:free tag): https://openrouter.ai/keys
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}"
      # v8 OMNI SOVEREIGN — Market Oracle refresh cadence
      MARKET_REFRESH_INTERVAL_S: "${MARKET_REFRESH_INTERVAL_S:-120}"
      # v8 OMNI SOVEREIGN — Resource Sovereign thresholds
      OOM_WARN_THRESHOLD: "${OOM_WARN_THRESHOLD:-0.80}"
      OOM_KILL_THRESHOLD: "${OOM_KILL_THRESHOLD:-0.92}"
      CPU_THROTTLE_THRESHOLD: "${CPU_THROTTLE_THRESHOLD:-0.90}"
      # ── BlockchainWarden tuning ────────────────────────────────────────
      # On Apple Silicon under QEMU emulation, AMD64 stellar-core takes
      # 20-60+ min for initial bucket-apply. Without this grace period the
      # warden's heal cycle (every 60s) restarts the node before it can
      # finish, creating an infinite restart loop. 2400s = 40 min.
