      # Dedicated M2M service token for HSM signing, wallet ops, and task execution.
      # Must match SAIB_SERVICE_TOKEN set in the Next.js app environment (.env file).
      # Generate with: openssl rand -hex 32   — never commit the value.
      SAIB_SERVICE_TOKEN: "${SAIB_SERVICE_TOKEN:-}"
      TRIUMPH_INTERNAL_URL: "${TRIUMPH_INTERNAL_URL:-http://triumph-app:3000}"
    secrets:
      - public_bridge_token
    group_add:
      - "0" # root group (GID 0) — docker.sock is rw-rw---- root:root; saib user needs this supplementary group to access the socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # SovereignHealer: restart/inspect containers
    networks:
      triumph-net:
        aliases:
          - triumph-sovereign-nano-saib
          - triumph-nano-saib
    depends_on:
      sovereign-military-bridge:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8201/health', timeout=25)" ]
      interval: 90s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ==========================================================================
  # SOVEREIGN MESH HUB — Encrypted Private Network (WireGuard)
  # ==========================================================================
  # ChaCha20-Poly1305 transport + Curve25519 ECDH + per-peer 256-bit PSK
  # Mesh subnet: 10.13.37.0/24
  # Hub API: :8200  |  WireGuard: :51820/udp
  # ==========================================================================

  sovereign-mesh-hub:
    build:
      context: docker/sovereign-mesh
      dockerfile: Dockerfile
    container_name: triumph-sovereign-mesh-hub
    <<: *common
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.40 # quantum-managed: T6 sovereign-mesh-hub — bumped after OOM
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      PORT: "8200"
      WG_INTERFACE: "wg-sovereign"
      WG_LISTEN_PORT: "51820"
      HUB_IP: "10.13.37.1"
      MESH_SUBNET: "10.13.37.0/24"
      # API key required for sensitive mutation endpoints (/mesh/register).
      # Set a strong random value in production.
      MESH_API_KEY: ${MESH_API_KEY:-}
    ports:
      - "8200:8200"
      - "51820:51820/udp"
    volumes:
      - triumph_mesh_keys:/app/keys
    networks:
      triumph-net:
        aliases:
          - triumph-sovereign-mesh-hub
      pi-bridge:
        aliases:
          - triumph-sovereign-mesh-hub
      sovereign-mesh:
        ipv4_address: 10.13.37.1
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health', timeout=25)" ]
      interval: 90s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ==========================================================================
  # UBUNTU ADMIN — Blockchain Admin Shell (Ubuntu 24.04 LTS)
  # Pi Network SCP Protocol 24 · GCV $314,159/π
  #
  # A persistent Ubuntu 24.04 container with full admin tooling for the
  # Triumph Synergy Digital Financial Ecosystem. Never starts automatically
  # (profile: tools) — use `docker compose --profile tools up -d ubuntu-admin`
  # to start, then: `docker exec -it triumph-ubuntu-admin bash`
  #
  # Admin CLI: docker exec -it triumph-ubuntu-admin node /admin/pi-admin.js --help
  # ==========================================================================
  ubuntu-admin:
    build:
      context: docker/ubuntu-admin
      dockerfile: Dockerfile
    container_name: triumph-ubuntu-admin
    profiles:
      - tools
    networks:
      - triumph-net
    environment:
      SAIB_ENFORCER_URL: "http://triumph-saib-enforcer:8210"
      STELLAR_HORIZON_URL: "${STELLAR_HORIZON_URL:-https://api.mainnet.minepi.com}"
      TRIUMPH_APP_URL: "http://triumph-app:3000"
      LEDGER_RING_MAX: "500"
      GCV_USD_PER_PI: "314159"
      PI_PROTOCOL_VERSION: "24"
      NODE_ENV: "production"
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.25
    labels:
      org.triumph.pod: "ubuntu-admin"
      org.triumph.purpose: "blockchain-admin-shell-ubuntu-24.04"
      org.triumph.protocol: "SCP-24"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://triumph-saib-enforcer:8210/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

# ==========================================================================
# VOLUMES — Persistent Data
# ==========================================================================

volumes:
  triumph_tokenization_data:
    name: triumph_tokenization_data
  triumph_pg_data:
    name: triumph_pg_data
  triumph_redis_data:
    name: triumph_redis_data
  triumph_central_data:
    name: triumph_central_data
  triumph_stellar_data:
    name: triumph_stellar_data
  triumph_tx_data:
    name: triumph_tx_data
  triumph_vault_data:
    name: triumph_vault_data
  triumph_contracts_data:
    name: triumph_contracts_data
  triumph_scp_data:
    name: triumph_scp_data
  triumph_prometheus_data:
    name: triumph_prometheus_data
  triumph_grafana_data:
    name: triumph_grafana_data
  triumph_cloud_memory_backup:
    name: triumph_cloud_memory_backup
  # Pi mainnet node volumes
  pi_mainnet_stellar:
    name: pi_mainnet_stellar
  pi_mainnet_logs:
    name: pi_mainnet_logs
  pi_mainnet_history:
    name: pi_mainnet_history
  triumph_mesh_keys:
    name: triumph_mesh_keys

# ==========================================================================
# NETWORK — Shared with Pi Network node for direct communication
# ==========================================================================
#
# After starting:  docker network connect pi-bridge triumph-pi-mainnet-node
# This connects the Pi Mainnet Node container to the ecosystem so central-node
# can communicate with it directly.
# ==========================================================================

networks:
  triumph-net:
    name: triumph-net
    driver: bridge
  pi-bridge:
    name: pi-bridge
    driver: bridge
  # Step 5: Redis Cluster network — external (created by docker-compose.redis-cluster.yml)
  redis-cluster-net:
    name: triumph-redis-cluster-net
    external: true
  # Sovereign encrypted mesh network — WireGuard encrypted, static IPs
  sovereign-mesh:
    name: triumph-sovereign-mesh
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.37.0/24
          gateway: 10.13.37.254

# ==========================================================================
# SECRETS — mounted into containers at /run/secrets/<name>
# Files are gitignored (secrets/ folder + *.txt under it). SAIB reads
# /run/secrets/github_token via _load_secret_or_env() helper.
# ==========================================================================

secrets:
  github_token:
    file: ./secrets/github_token.txt
  peer_pubkeys:
    file: ./secrets/peer_pubkeys.json
  public_bridge_token:
    file: ./secrets/public_bridge_token.txt
