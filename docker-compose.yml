  # ========================================================================
  health-governor:
    build:
      context: docker/health-governor
    container_name: triumph-health-governor
    <<: *common
    mem_limit: 64m
    mem_reservation: 24m
    cpus: 0.15
    environment:
      GOVERNOR_INTERVAL_S: "30"
      MEMORY_WARN_PCT: "80"
      MEMORY_KILL_PCT: "101"
      METRICS_PORT: "9912"
      CONTAINER_PREFIX: "triumph-"
      PROTECTED_CONTAINERS: "triumph-postgres,triumph-redis"
      HEALTH_FAIL_THRESHOLD: "10"
      RESTART_BACKOFF_BASE_S: "60"
      RESTART_BACKOFF_MAX_S: "600"
      HEALTH_PROBE_TIMEOUT_S: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
